<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Метод ломаных · глобальная минимизация на отрезке</title>
  <style>
    :root {
      --bg: #f4efe6;
      --paper: #fffdf8;
      --ink: #1c1916;
      --muted: #6b645b;
      --line: #d9d0c3;
      --accent: #1f4d63;
      --accent-soft: #e4eef2;
      --pivot: #b45309;
      --pivot-soft: #f3e0c8;
      --enter: #155e75;
      --leave: #9a3412;
      --ok: #3f6212;
      --ok-soft: #e8efd8;
      --bad: #9f1239;
      --shadow: 0 0 0 1px var(--line);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: "Segoe UI", "Iosevka", "Cambria", Georgia, serif;
      background: var(--bg);
      color: var(--ink);
      overflow: hidden;
    }

    .app {
      display: grid;
      grid-template-rows: 56px 1fr 44px;
      height: 100%;
    }

    header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 0 18px;
      border-bottom: 1px solid var(--line);
      background: var(--paper);
    }
    header .brand { font-weight: 650; letter-spacing: 0.01em; }
    header .brand span { color: var(--muted); font-weight: 500; }
    .phase {
      font-size: 13px;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 4px 10px;
      border-radius: 999px;
      white-space: nowrap;
    }
    .progress {
      flex: 1;
      height: 4px;
      background: var(--line);
      border-radius: 99px;
      overflow: hidden;
    }
    .progress > i {
      display: block;
      height: 100%;
      background: var(--accent);
      width: 0;
    }
    .counter { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; min-width: 52px; text-align: right; }

    .nav-btn {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--paper);
      color: var(--ink);
      height: 32px;
      min-width: 32px;
      padding: 0 10px;
      border-radius: 6px;
      cursor: pointer;
      font: inherit;
      font-size: 14px;
    }
    .nav-btn:hover { border-color: var(--accent); color: var(--accent); }
    .nav-btn:disabled { opacity: 0.35; cursor: default; }

    .stage {
      display: grid;
      grid-template-columns: 220px 1fr;
      min-height: 0;
    }
    .stage.wide-slide { grid-template-columns: 200px 1fr; }

    .toc {
      border-right: 1px solid var(--line);
      padding: 14px 10px;
      overflow: auto;
      background: #f7f3eb;
    }
    .toc h2 {
      margin: 0 8px 10px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      font-weight: 650;
    }
    .toc button {
      display: block;
      width: 100%;
      text-align: left;
      border: 0;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 13px;
      padding: 7px 8px;
      border-radius: 6px;
      cursor: pointer;
    }
    .toc button.active {
      background: var(--paper);
      color: var(--ink);
      box-shadow: var(--shadow);
    }
    .toc button .n {
      display: inline-block;
      width: 18px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    main { overflow: auto; padding: 28px 36px 40px; }
    .slide { max-width: 1140px; }
    .slide.wide { max-width: 860px; }
    .slide.wide h1 { font-size: 22px; }
    .slide.wide .lead { margin-bottom: 12px; font-size: 15px; }
    .slide.wide.geom-slide,
    .slide.wide.hw-slide,
    .slide.wide.chain-slide { max-width: 1180px; }
    .slide.wide.geom-slide h1,
    .slide.wide.hw-slide h1,
    .slide.wide.chain-slide h1 { font-size: 24px; }

    .slide h1 {
      font-size: 28px;
      font-weight: 650;
      margin: 0 0 8px;
      letter-spacing: -0.02em;
    }
    .lead { color: var(--muted); font-size: 16px; margin: 0 0 22px; line-height: 1.45; }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }
    .card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 16px 18px;
    }
    .card h3 {
      margin: 0 0 10px;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
    }
    .eq {
      font-family: "Cambria Math", "Times New Roman", serif;
      font-size: 18px;
      line-height: 1.7;
    }
    .note { font-size: 14px; color: var(--muted); line-height: 1.5; margin-top: 10px; }
    .tag {
      display: inline-block;
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 99px;
      background: var(--accent-soft);
      color: var(--accent);
      margin-right: 6px;
    }
    .tag.warn { background: var(--pivot-soft); color: var(--pivot); }
    .tag.ok { background: var(--ok-soft); color: var(--ok); }

    .steps { margin: 0; padding: 0; list-style: none; }
    .steps li {
      display: grid;
      grid-template-columns: 28px 1fr;
      gap: 10px;
      margin-bottom: 12px;
      font-size: 15px;
      line-height: 1.45;
    }
    .steps .num {
      width: 28px; height: 28px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      display: grid; place-items: center;
      font-size: 13px; font-weight: 650;
    }

    table.sx {
      border-collapse: collapse;
      font-variant-numeric: tabular-nums;
      font-size: 15px;
      background: var(--paper);
    }
    table.sx th, table.sx td {
      border: 1px solid var(--line);
      padding: 6px 9px;
      text-align: center;
      min-width: 52px;
    }
    table.sx th { background: #f3eee4; font-weight: 650; font-size: 13px; }
    table.sx td.rowh { background: #f3eee4; font-weight: 650; text-align: left; }
    table.sx td.pick { background: #e8c48a; font-weight: 750; color: var(--leave); }
    table.sx td.up { background: var(--accent-soft); }
    table.sx td.best { background: var(--ok-soft); font-weight: 650; }
    table.sx.tiny th, table.sx.tiny td { padding: 4px 7px; font-size: 13px; min-width: 40px; }

    .legend { display: flex; gap: 14px; flex-wrap: wrap; margin: 10px 0 0; font-size: 13px; color: var(--muted); }
    .sw { display: inline-block; width: 12px; height: 12px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }

    footer {
      border-top: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      background: var(--paper);
      color: var(--muted);
      font-size: 12px;
    }
    kbd {
      font-family: inherit;
      font-size: 11px;
      border: 1px solid var(--line);
      background: #f7f3eb;
      padding: 1px 5px;
      border-radius: 4px;
    }

    .problem {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 22px 26px 20px;
    }
    .problem .given { font-size: 16px; line-height: 1.55; margin: 0 0 16px; }
    .problem .label {
      display: block;
      font-size: 12px;
      font-weight: 650;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 6px;
    }

    .callout {
      border-left: 3px solid var(--accent);
      padding: 10px 14px;
      background: var(--accent-soft);
      border-radius: 0 8px 8px 0;
      margin: 16px 0;
      font-size: 15px;
      line-height: 1.45;
    }
    .callout.warn { border-color: var(--pivot); background: var(--pivot-soft); }
    .callout.ok { border-color: var(--ok); background: var(--ok-soft); }

    .links { list-style: none; margin: 0; padding: 0; }
    .links li { margin: 0 0 8px; font-size: 14px; line-height: 1.4; }
    .links a { color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--line); }
    .links a:hover { border-bottom-color: var(--accent); }

    .seg { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 14px; }
    .seg button {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--paper);
      color: var(--ink);
      font: inherit;
      font-size: 13px;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
    }
    .seg button.on {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
    }

    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 0; }
    .chip {
      border: 1px solid var(--line);
      background: var(--paper);
      padding: 8px 10px;
      border-radius: 8px;
      text-align: center;
      min-width: 84px;
    }
    .chip .k { display: block; font-size: 12px; color: var(--muted); }
    .chip .v { display: block; font-size: 20px; font-weight: 650; margin-top: 2px; }
    .chip.pick { background: var(--pivot-soft); border-color: var(--pivot); }
    .chip.ok { background: var(--ok-soft); border-color: var(--ok); }
    .chip.skip { opacity: 0.55; }

    .fig {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
    }
    .fig svg { display: block; width: 100%; height: auto; }

    .geom-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(260px, 320px);
      gap: 18px;
      align-items: start;
    }
    .geom-story { display: flex; flex-direction: column; gap: 10px; }
    .geom-story .card { padding: 14px 16px; }
    .geom-story .card h3 { margin-bottom: 8px; }
    .geom-story .card p { margin: 0 0 8px; }
    .geom-story .card p:last-child { margin-bottom: 0; }
    .geom-story .card.start { border-left: 3px solid #1c1916; }
    .geom-story .card.best { border-left: 3px solid var(--accent); background: var(--accent-soft); }
    .geom-story .card.local { border-left: 3px solid var(--pivot); }
    .geom-legend {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      padding: 2px 14px 12px;
      font-size: 12px;
      color: var(--muted);
    }
    .geom-legend .sw { border: 1px solid rgba(28,25,22,0.12); }

    .idea-pills { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 12px; }
    .idea-pills button {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--paper);
      color: var(--ink);
      border-radius: 99px;
      padding: 5px 11px;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
    }
    .idea-pills button.on {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 650;
    }
    .idea-dock {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(280px, 340px);
      gap: 16px;
      align-items: start;
      margin-top: 2px;
    }
    .idea-dock .card p { margin: 0 0 8px; }
    .idea-dock .card p:last-child { margin-bottom: 0; }
    .idea-dock table.sx { width: 100%; }
    .idea-dock table.sx td, .idea-dock table.sx th { text-align: left; }
    .idea-hit { cursor: pointer; }
    .idea-dock table.sx button {
      appearance: none;
      font: inherit;
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 99px;
      border: 1px solid var(--line);
      background: var(--paper);
      cursor: pointer;
    }
    .idea-dock table.sx tr.pick button {
      background: var(--pivot-soft);
      border-color: var(--pivot);
    }
    .slide.work-slide .idea-pills button { font-size: 12px; padding: 4px 9px; }
    .slide.work-slide .idea-dock {
      grid-template-columns: minmax(0, 1.15fr) minmax(300px, 370px);
    }
    .slide.work-slide #work-side {
      max-height: 440px;
      overflow: auto;
    }
    .work-sheet {
      background: #f7f3eb;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 10px;
      margin: 8px 0 0;
    }
    .work-sheet .eq { font-size: 15px; margin: 6px 0; }
    .work-sheet p { margin: 0 0 6px; }
    .work-sheet p:last-child { margin-bottom: 0; }
    .work-sheet .k {
      font-size: 12px;
      font-weight: 650;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .work-mini { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 0; }
    .work-mini span {
      font-size: 12px;
      padding: 2px 7px;
      border-radius: 99px;
      border: 1px solid var(--line);
      background: #f7f3eb;
      color: var(--muted);
    }
    .work-mini span.on { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); font-weight: 650; }
    .work-mini span.last { background: var(--pivot-soft); border-color: var(--pivot); color: var(--pivot); }

    .hw-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 16px;
      align-items: start;
    }
    .hw-layout .card p { margin: 0 0 8px; }
    .hw-layout .card p:last-child { margin-bottom: 0; }
    .hw-layout .card + .card { margin-top: 10px; }
    .ban { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 0; }
    .ban span {
      font-size: 12px;
      padding: 3px 8px;
      border-radius: 99px;
      background: #f8e8ea;
      color: var(--bad);
      border: 1px solid #e8c5cc;
    }
    .codebox {
      font-family: Consolas, "Segoe UI Mono", monospace;
      font-size: 13px;
      line-height: 1.55;
      background: #f7f3eb;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
      margin: 8px 0 0;
    }

    .why { font-size: 15px; line-height: 1.5; }
    .why p { margin: 8px 0; }
    .why .eq { font-size: 17px; }
    .why .k { font-weight: 650; }
    .why .old2 {
      font-family: "Cambria Math", "Times New Roman", serif;
      font-size: 17px;
      line-height: 1.7;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 12px;
      margin: 8px 0;
    }
    .mk { padding: 0 3px; border-radius: 3px; font-weight: 650; }
    .mk.p { background: #e8c48a; }
    .mk.n { background: #f6e6d4; }
    .mk.t { background: #dbeaf0; }
    .mk.q { background: #e8efd8; }

    .pocket {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 8px;
      margin: 10px 0 0;
    }
    .pocket summary {
      cursor: pointer;
      padding: 8px 12px;
      list-style: none;
      display: block;
    }
    .pocket summary::-webkit-details-marker { display: none; }
    .pocket-title::before { content: "▸ "; color: var(--accent); }
    .pocket[open] .pocket-title::before { content: "▾ "; }
    .pocket-title { font-weight: 650; }
    .pocket-body { padding: 4px 12px 12px; border-top: 1px solid var(--line); }

    .rb-chain { display: flex; flex-direction: column; align-items: stretch; }
    .rb-block {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px 14px;
    }
    .rb-block.calc { border-left: 4px solid var(--accent); background: #f7f3eb; }
    .rb-block.fresh { box-shadow: 0 0 0 2px var(--accent); }
    .rb-block h3 { margin: 0 0 8px; font-size: 16px; font-weight: 650; }
    .rb-down {
      text-align: center;
      color: var(--accent);
      font-size: 20px;
      line-height: 1;
      padding: 6px 0;
      font-weight: 650;
    }
    .tbl-cap {
      font-size: 12px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 650;
      margin: 0 0 8px;
    }
    .rebuild-nav {
      display: flex;
      align-items: center;
      gap: 10px;
      position: sticky;
      top: 0;
      z-index: 3;
      background: var(--bg);
      padding: 4px 0 10px;
      margin: 0 0 8px;
    }
    .rebuild-nav .cnt { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; }
    .rebuild-nav .hint { font-size: 13px; color: var(--muted); }
    .state-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.25fr) minmax(260px, 340px);
      gap: 14px;
      align-items: start;
    }

    .frac { display: inline-flex; flex-direction: column; align-items: center; line-height: 1.05; vertical-align: middle; font-size: 0.85em; }
    .frac span { padding: 0 3px; }
    .frac .num { border-bottom: 1px solid currentColor; }
    .bigstat { font-size: 26px; font-weight: 650; margin: 8px 0 4px; }
    .muted { color: var(--muted); }

    .lip-ex {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 16px;
    }
    .lip-ex .card p:last-child { margin-bottom: 0; }
    .card h3.ok-cap { color: var(--ok); }
    .card h3.bad-cap { color: var(--bad); }
    .card a, .note a { color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--line); }

    .range-row {
      display: grid;
      grid-template-columns: 90px 1fr 64px;
      gap: 10px;
      align-items: center;
      margin: 8px 0;
    }
    .range-row input[type="range"] { width: 100%; }
    .live-eq { font-size: 20px; margin: 8px 0 0; font-family: "Cambria Math", "Times New Roman", serif; }

    .flow {
      display: grid;
      grid-template-columns: 1fr 28px 1fr 28px 1fr 28px 1fr;
      gap: 8px;
      align-items: stretch;
      margin: 4px 0 8px;
    }
    .flow .box {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 13px;
      line-height: 1.4;
    }
    .flow .box b { display: block; margin-bottom: 4px; }
    .flow .arr {
      display: grid;
      place-items: center;
      color: var(--accent);
      font-size: 22px;
      font-weight: 650;
    }

    @media (max-width: 1100px) {
      .stage { grid-template-columns: 180px 1fr; }
      main { padding: 20px; }
      .grid-2, .geom-layout, .hw-layout, .state-grid, .lip-ex { grid-template-columns: 1fr; }
      .flow { grid-template-columns: 1fr; }
      .flow .arr { transform: rotate(90deg); padding: 0; height: 20px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">Метод ломаных <span>· практика 2</span></div>
      <div class="phase" id="phase">Постановка</div>
      <div class="progress"><i id="bar"></i></div>
      <div class="counter" id="counter">1 / 1</div>
      <button class="nav-btn" id="prev" type="button">←</button>
      <button class="nav-btn" id="next" type="button">→</button>
    </header>
    <div class="stage">
      <nav class="toc" id="toc"></nav>
      <main id="main"></main>
    </div>
    <footer>
      <div>Пример: W(x) = ½(x−2)² + sin(πx) на [0, 4], L = 6, ε = 1</div>
      <div><kbd>←</kbd> <kbd>→</kbd> шаг · <kbd>F11</kbd> на проектор</div>
    </footer>
  </div>

<script>
(function () {
  const L = 6;
  const EPS = 1;
  const A = 0;
  const B = 4;

  function W(x) {
    return 0.5 * (x - 2) * (x - 2) + Math.sin(Math.PI * x);
  }
  function Wpair(x) {
    if (Math.abs(x) < 1e-12) return 2;
    if (Math.abs(x - 4) < 1e-12) return 2;
    if (Math.abs(x - 2) < 1e-12) return 0;
    return W(x);
  }
  function Wp(x) {
    return (x - 2) + Math.PI * Math.cos(Math.PI * x);
  }
  function cross(uq, Wq, uv, Wv) {
    const x = (Wq - Wv) / (2 * L) + (uq + uv) / 2;
    const p = Wq - L * (x - uq);
    return { x: x, p: p };
  }
  function fmt(v, n) {
    n = n == null ? 3 : n;
    const s = Number(v).toFixed(n);
    return s.replace("-", "−");
  }
  function brokenPts(uppers) {
    const pts = [];
    for (let i = 0; i < uppers.length - 1; i++) {
      const a = uppers[i], b = uppers[i + 1];
      const c = cross(a[0], a[1], b[0], b[1]);
      if (i === 0) pts.push([a[0], a[1]]);
      pts.push([c.x, c.p], [b[0], b[1]]);
    }
    return pts;
  }

  function sampleFun(fn, x0, x1, n) {
    const pts = [];
    for (let i = 0; i <= n; i++) {
      const x = x0 + (x1 - x0) * i / n;
      pts.push([x, fn(x)]);
    }
    return pts;
  }

  function svgCurve(opt) {
    opt = opt || {};
    const w = opt.w || 720;
    const h = opt.h || 280;
    const padL = 44, padR = 14, padT = 16, padB = 28;
    const x0 = opt.x0;
    const x1 = opt.x1;
    const fn = opt.fn;
    const n = opt.n || 220;
    const samples = opt.samples || (fn ? sampleFun(fn, x0, x1, n) : []);
    let yMin = opt.yMin;
    let yMax = opt.yMax;
    if (yMin == null || yMax == null) {
      const ys = samples.map(function (p) { return p[1]; });
      yMin = Math.min.apply(null, ys);
      yMax = Math.max.apply(null, ys);
      const span = Math.max(0.8, yMax - yMin);
      yMin -= span * 0.10;
      yMax += span * 0.12;
    }
    function X(x) { return padL + (x - x0) / (x1 - x0) * (w - padL - padR); }
    function Y(y) { return padT + (yMax - y) / (yMax - yMin) * (h - padT - padB); }
    function pathOf(pts) {
      return pts.map(function (p, i) {
        return (i ? "L" : "M") + X(p[0]).toFixed(1) + " " + Y(p[1]).toFixed(1);
      }).join(" ");
    }
    function ticksX() {
      if (opt.xticks) return opt.xticks;
      const out = [];
      const step = opt.xstep || 1;
      for (let t = Math.ceil(x0 / step) * step; t <= x1 + 1e-9; t += step) out.push(t);
      return out;
    }

    let g = '<svg viewBox="0 0 ' + w + " " + h + '" role="img">';
    g += '<rect width="' + w + '" height="' + h + '" fill="#fffdf8"/>';
    g += '<g font-family="Segoe UI, Cambria, Georgia, serif">';
    ticksX().forEach(function (t) {
      g += '<line x1="' + X(t) + '" y1="' + Y(yMin) + '" x2="' + X(t) + '" y2="' + Y(yMax) + '" stroke="#efe8dc"/>';
      g += '<text x="' + X(t) + '" y="' + (h - 8) + '" font-size="12" fill="#6b645b" text-anchor="middle">' + t + "</text>";
    });
    const yTicks = opt.yTicks || 4;
    for (let i = 0; i <= yTicks; i++) {
      const yv = yMin + (yMax - yMin) * i / yTicks;
      g += '<line x1="' + X(x0) + '" y1="' + Y(yv) + '" x2="' + X(x1) + '" y2="' + Y(yv) + '" stroke="#efe8dc"/>';
      g += '<text x="' + (padL - 8) + '" y="' + (Y(yv) + 4) + '" font-size="11" fill="#6b645b" text-anchor="end">' + fmt(yv, 1) + "</text>";
    }
    if (yMin < 0 && yMax > 0) {
      g += '<line x1="' + X(x0) + '" y1="' + Y(0) + '" x2="' + X(x1) + '" y2="' + Y(0) + '" stroke="#d9d0c3"/>';
    }

    if (opt.cone) {
      const u = opt.cone.u;
      const ell = opt.cone.L;
      const Wu = opt.cone.Wu != null ? opt.cone.Wu : fn(u);
      const hi = [], lo = [];
      for (let i = 0; i <= 80; i++) {
        const x = x0 + (x1 - x0) * i / 80;
        const d = ell * Math.abs(x - u);
        hi.push([x, Wu + d]);
        lo.push([x, Wu - d]);
      }
      const band = hi.concat(lo.slice().reverse());
      g += '<path d="' + pathOf(band) + 'Z" fill="#e4eef2" fill-opacity="0.85" stroke="none"/>';
      g += '<path d="' + pathOf(hi) + '" fill="none" stroke="#1f4d63" stroke-width="1.4" stroke-dasharray="5 4"/>';
      g += '<path d="' + pathOf(lo) + '" fill="none" stroke="#1f4d63" stroke-width="1.4" stroke-dasharray="5 4"/>';
      g += '<circle cx="' + X(u) + '" cy="' + Y(Wu) + '" r="5" fill="#1f4d63"/>';
    }

    (opt.vlines || []).forEach(function (v) {
      g += '<line x1="' + X(v.x) + '" y1="' + Y(v.y1) + '" x2="' + X(v.x) + '" y2="' + Y(v.y2) + '" stroke="' + (v.stroke || "#9f1239") + '" stroke-width="1.6" stroke-dasharray="4 3"/>';
    });
    if (fn && !opt.noFn) {
      g += '<path d="' + pathOf(samples) + '" fill="none" stroke="' + (opt.stroke || "#1c1916") + '" stroke-width="2.2"/>';
    }
    if (opt.broken) {
      opt.broken.forEach(function (seg) {
        const pts = seg.pts || seg;
        const stroke = seg.stroke || "#b45309";
        g += '<path d="' + pathOf(pts) + '" fill="none" stroke="' + stroke + '" stroke-width="2.2"/>';
      });
    }

    (opt.points || []).forEach(function (p) {
      g += '<circle cx="' + X(p.x) + '" cy="' + Y(p.y) + '" r="' + (p.r || 6) + '" fill="' + (p.fill || "#1c1916") + '"'
        + (p.stroke ? ' stroke="' + p.stroke + '" stroke-width="' + (p.sw || 2) + '"' : "")
        + "/>";
    });
    (opt.marks || []).forEach(function (m) {
      g += '<text x="' + (X(m.x) + (m.dx || 8)) + '" y="' + (Y(m.y) + (m.dy || -8)) + '" font-size="13" font-weight="650" fill="' + (m.fill || "#1c1916") + '">' + m.text + "</text>";
    });
    g += "</g></svg>";

  function ideaW(x) {
    return 0.42 + 0.20 * (x - 2) * (x - 2) + 0.06 * Math.sin(Math.PI * x / 2);
  }

  function svgIdea(opt) {
    opt = opt || {};
    const ell = opt.L || 0.95;
    const w = opt.w || 880;
    const h = opt.h || 390;
    const padL = 46, padR = 18, padT = 34, padB = 56;
    const x0 = -0.15, x1 = 4.35;
    const yMin = -1.25, yMax = 1.65;
    function X(x) { return padL + (x - x0) / (x1 - x0) * (w - padL - padR); }
    function Y(y) { return padT + (yMax - y) / (yMax - yMin) * (h - padT - padB); }
    function pathOf(pts) {
      return pts.map(function (p, i) {
        return (i ? "L" : "M") + X(p[0]).toFixed(1) + " " + Y(p[1]).toFixed(1);
      }).join(" ");
    }
    function pill(px, py, text, kind) {
      const tw = Math.max(36, text.length * 7.05 + 14);
      const th = 20;
      const x = px - tw / 2;
      const y = py - th / 2;
      const fill = kind === "pick" ? "#f3e0c8" : kind === "ok" ? "#e8efd8" : kind === "idle" ? "#fffdf8" : "#e4eef2";
      const stroke = kind === "pick" ? "#b45309" : kind === "ok" ? "#3f6212" : kind === "idle" ? "#a39b90" : "#1f4d63";
      const ink = kind === "pick" ? "#9a3412" : kind === "ok" ? "#3f6212" : kind === "idle" ? "#6b645b" : "#1f4d63";
      return '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + tw.toFixed(1) + '" height="' + th + '" rx="10" fill="' + fill + '" stroke="' + stroke + '"/>'
        + '<text x="' + px.toFixed(1) + '" y="' + (py + 4).toFixed(1) + '" font-size="12" font-weight="650" fill="' + ink + '" text-anchor="middle">' + text + "</text>";
    }
    const samples = [];
    for (let i = 0; i <= 220; i++) {
      const x = 4 * i / 220;
      samples.push([x, ideaW(x)]);
    }
    const uppers = (opt.uppers || []).slice().sort(function (a, b) { return a[0] - b[0]; });
    const lowers = opt.lowers || [];
    const pick = opt.pick;
    const look = opt.look;
    let g = '<svg viewBox="0 0 ' + w + " " + h + '" role="img">';
    g += '<rect width="' + w + '" height="' + h + '" fill="#fffdf8"/>';
    g += '<g font-family="Segoe UI, Cambria, Georgia, serif">';
    g += '<line x1="' + X(x0) + '" y1="' + Y(0) + '" x2="' + X(x1) + '" y2="' + Y(0) + '" stroke="#d9d0c3"/>';
    g += '<line x1="' + X(0) + '" y1="' + Y(yMin) + '" x2="' + X(0) + '" y2="' + Y(yMax) + '" stroke="#d9d0c3"/>';
    g += '<text x="' + (w - 10) + '" y="' + (Y(0) - 8) + '" font-size="12" fill="#6b645b" text-anchor="end">x</text>';
    g += '<text x="' + (X(0) + 8) + '" y="' + (padT + 2) + '" font-size="12" fill="#6b645b">W(x)</text>';
    if (opt.showW !== false) {
      g += '<path d="' + pathOf(samples) + '" fill="none" stroke="#1c1916" stroke-width="2"/>';
    }
    const raySrc = opt.rays != null ? opt.rays : (opt.bare ? [] : uppers);
    raySrc.forEach(function (u) {
      const accent = opt.accentX != null && Math.abs(u[0] - opt.accentX) < 1e-6;
      const ray = [];
      for (let i = 0; i <= 80; i++) {
        const x = x0 + (x1 - x0) * i / 80;
        ray.push([x, u[1] - ell * Math.abs(x - u[0])]);
      }
      g += '<path d="' + pathOf(ray) + '" fill="none" stroke="' + (accent ? "#3f6212" : "#c5d0c2") + '" stroke-width="' + (accent ? 2.5 : 1.3) + '"/>';
    });
    if (opt.slopes && raySrc.length) {
      const u = opt.accentX != null
        ? (raySrc.filter(function (p) { return Math.abs(p[0] - opt.accentX) < 1e-6; })[0] || raySrc[0])
        : raySrc[0];
      const d = 0.9;
      if (u[0] > 0.35) g += pill(X(u[0] - d), Y(u[1] - ell * d) + 2, "+L", "up");
      if (u[0] < 3.65) g += pill(X(u[0] + d), Y(u[1] - ell * d) + 2, "−L", "up");
    }
    if (!opt.bare && opt.env !== false && uppers.length >= 2) {
      const env = [];
      for (let i = 0; i < uppers.length - 1; i++) {
        const a = uppers[i], b = uppers[i + 1];
        const xx = (a[1] - b[1]) / (2 * ell) + (a[0] + b[0]) / 2;
        const pp = a[1] - ell * (xx - a[0]);
        if (i === 0) env.push([a[0], a[1]]);
        env.push([xx, pp], [b[0], b[1]]);
      }
      g += '<path d="' + pathOf(env) + '" fill="none" stroke="#3f6212" stroke-width="2.6"/>';
    }
    uppers.forEach(function (u) {
      g += '<line x1="' + X(u[0]) + '" y1="' + Y(0) + '" x2="' + X(u[0]) + '" y2="' + Y(u[1]) + '" stroke="#cfc6b8" stroke-width="1.1" stroke-dasharray="3 3"/>';
    });
    lowers.forEach(function (lo, i) {
      const isPick = pick != null && Math.abs(lo.x - pick) < 1e-6;
      const isLook = look != null && look === i;
      g += '<line x1="' + X(lo.x) + '" y1="' + Y(lo.p) + '" x2="' + X(lo.x) + '" y2="' + (h - 22) + '" stroke="' + (isPick ? "#b45309" : "#d9d0c3") + '" stroke-width="1.1" stroke-dasharray="3 3"/>';
      g += '<circle class="idea-hit" data-lo="' + i + '" cx="' + X(lo.x) + '" cy="' + Y(lo.p) + '" r="14" fill="transparent"/>';
      g += '<circle class="idea-hit" data-lo="' + i + '" cx="' + X(lo.x) + '" cy="' + Y(lo.p) + '" r="' + (isPick ? 7 : 5.5) + '" fill="' + (isPick ? "#b45309" : "#fffdf8") + '" stroke="' + (isLook && !isPick ? "#1f4d63" : "#b45309") + '" stroke-width="' + (isLook ? 2.4 : 1.6) + '"/>';
    });
    if (opt.lift) {
      const lf = opt.lift;
      g += '<line x1="' + X(lf.x) + '" y1="' + Y(lf.p) + '" x2="' + X(lf.x) + '" y2="' + Y(lf.Wu) + '" stroke="#b45309" stroke-width="2.4"/>';
      g += '<polygon points="' + X(lf.x).toFixed(1) + "," + Y(lf.Wu).toFixed(1) + " " + (X(lf.x) - 6).toFixed(1) + "," + (Y(lf.Wu) + 12).toFixed(1) + " " + (X(lf.x) + 6).toFixed(1) + "," + (Y(lf.Wu) + 12).toFixed(1) + '" fill="#b45309"/>';
      g += '<circle cx="' + X(lf.x) + '" cy="' + Y(lf.Wu) + '" r="6.5" fill="#1c1916"/>';
      g += pill(X(lf.x) + 44, (Y(lf.p) + Y(lf.Wu)) / 2, "тот же x", "pick");
      g += pill(X(lf.x) - 38, Y(lf.p) + 2, "p, ломаная", "idle");
    }
    if (opt.gap) {
      const gp = opt.gap;
      g += '<line x1="' + X(gp.x) + '" y1="' + Y(gp.p) + '" x2="' + X(gp.x) + '" y2="' + Y(gp.Wu) + '" stroke="#9f1239" stroke-width="2.2"/>';
      g += '<circle cx="' + X(gp.x) + '" cy="' + Y(gp.p) + '" r="4.5" fill="#fffdf8" stroke="#9f1239" stroke-width="1.6"/>';
      g += pill(X(gp.x) + 48, (Y(gp.p) + Y(gp.Wu)) / 2, "δ = " + gp.delta, "pick");
    }
    uppers.forEach(function (u) {
      const isAns = opt.answer && Math.abs(u[0] - opt.answer[0]) < 1e-6;
      g += '<circle cx="' + X(u[0]) + '" cy="' + Y(u[1]) + '" r="' + (isAns ? 8 : 5.5) + '" fill="' + (isAns ? "#3f6212" : "#1c1916") + '"'
        + (isAns ? ' stroke="#1c1916" stroke-width="1.4"' : "") + "/>";
    });
    if (opt.answer) {
      g += pill(X(opt.answer[0]), Y(opt.answer[1]) - 22, "ответ", "ok");
    }
    const usedTop = [];
    function topY(px) {
      let yy = Y(ideaW(Math.max(0, Math.min(4, px)))) - 18;
      usedTop.forEach(function (t) {
        if (Math.abs(t.x - px) < 0.85 && Math.abs(t.y - yy) < 18) yy -= 20;
      });
      usedTop.push({ x: px, y: yy });
      return yy;
    }
    if (opt.labelU) {
      opt.labelU.forEach(function (lb) {
        g += pill(X(lb.x), topY(lb.x), lb.text, "up");
      });
    }
    if (opt.foot) {
      const showAll = lowers.length <= 2;
      lowers.forEach(function (lo) {
        const isPick = pick != null && Math.abs(lo.x - pick) < 1e-6;
        if (!showAll && !isPick) return;
        g += pill(X(lo.x), h - 16, isPick ? "этот x" : "не этот x", isPick ? "pick" : "idle");
      });
    }
    g += '<text x="' + (X(0) + 10) + '" y="' + (Y(0) + 16) + '" font-size="12" fill="#6b645b">a</text>';
    g += '<text x="' + (X(4) - 10) + '" y="' + (Y(0) + 16) + '" font-size="12" fill="#6b645b" text-anchor="end">b</text>';
    g += "</g></svg>";
    return g;
  }

  function bindIdea() {
    const fig = document.getElementById("idea-fig");
    const card = document.getElementById("idea-card");
    const side = document.getElementById("idea-side");
    const pills = document.getElementById("idea-pills");
    const cnt = document.getElementById("idea-cnt");
    const prevB = document.getElementById("rb-prev");
    const nextB = document.getElementById("rb-next");
    if (!fig) return;
    const ell = 0.95;
    function xcross(uq, Wq, uv, Wv) {
      const x = (Wq - Wv) / (2 * ell) + (uq + uv) / 2;
      return { x: x, p: Wq - ell * (x - uq) };
    }
    function lowersOf(U) {
      const s = U.slice().sort(function (a, b) { return a[0] - b[0]; });
      const out = [];
      for (let i = 0; i < s.length - 1; i++) out.push(xcross(s[i][0], s[i][1], s[i + 1][0], s[i + 1][1]));
      return out;
    }
    function pickOf(lows) {
      let best = lows[0];
      lows.forEach(function (lo) {
        if (lo.p < best.p - 1e-12 || (Math.abs(lo.p - best.p) < 1e-12 && lo.x < best.x)) best = lo;
      });
      return best;
    }
    function grow(U) {
      const pk = pickOf(lowersOf(U));
      return U.concat([[pk.x, ideaW(pk.x)]]);
    }
    const U0 = [[0, ideaW(0)], [4, ideaW(4)]];
    const hist = [U0];
    const picks = [];
    for (let t = 0; t < 4; t++) {
      picks.push(pickOf(lowersOf(hist[t])));
      hist.push(grow(hist[t]));
    }
    const ideaEps = 0.28;
    const lastLo = picks[3];
    const lastDelta = ideaW(lastLo.x) - lastLo.p;
    let answer = hist[4][0];
    hist[4].forEach(function (u) {
      if (u[1] < answer[1] - 1e-12) answer = u;
    });
    const sub = "₀₁₂₃₄₅₆₇₈₉";
    function subn(n) {
      return String(n).split("").map(function (d) { return sub[+d]; }).join("");
    }
    function nameU(x) {
      if (Math.abs(x) < 1e-6) return "W(u₀)";
      if (Math.abs(x - 4) < 1e-6) return "W(u₁)";
      for (let i = 0; i < picks.length; i++) {
        if (Math.abs(x - picks[i].x) < 1e-4) return "W(u" + subn(i + 2) + ")";
      }
      return "W";
    }
    const names = ["Концы", "Ломаная", "Проба u₂", "Два угла", "u₃ слева", "u₄ справа", "u₅", "Стоп"];
    const steps = [
      {
        uppers: hist[0],
        bare: true,
        title: "Сначала только концы",
        body: "Ищем дно ямы на [a, b]. Первые пробы на концах. W там уже есть. Дальше каждый шаг одна новая проба."
      },
      {
        uppers: hist[0],
        foot: true,
        showPick: true,
        title: "Две галочки, один угол",
        body: "Из каждой чёрной точки галочка ±L. Зелёная ломаная, их потолок. Один нижний угол, посередине ямы. Туда сейчас пойдём считать W.",
        eq: "g = W(u) − L|x − u|, &nbsp; p = max g"
      },
      {
        uppers: hist[0],
        foot: true,
        showPick: true,
        liftLo: picks[0],
        title: "Посчитали W(u₂)",
        body: "В выбранном x посчитали W. Точка села на дно ямы, на график. Оранжевый угол, это было p. Дальше из новой точки нарисуем галочку и пересоберём ломаную."
      },
      {
        uppers: hist[1],
        foot: true,
        showPick: true,
        title: "Ломаная из трёх галочек",
        body: "Старый угол исчез. Два новых, p одинаковый. На этом шаге W только слева. Правый кружок не выкинули, просто пробы там нет."
      },
      {
        uppers: hist[2],
        foot: true,
        showPick: true,
        title: "Посчитали W(u₃) слева",
        body: "Левый угол стал чёрной точкой. Ломаную снова перерисовали. Правый пустой кружок тот же. Теперь он самый нижний, оранжевый переехал."
      },
      {
        uppers: hist[3],
        foot: true,
        showPick: true,
        title: "Посчитали W(u₄) справа",
        body: "Отдельный шаг. Тот x, который был «не этот», стал самым нижним, вот тогда посчитали W. Снова смотрим все углы новой ломаной."
      },
      {
        uppers: hist[4],
        foot: true,
        showPick: false,
        title: "Посчитали W(u₅)",
        body: "Опять проба в самом нижнем угле. Теперь смотрим зазор: насколько ломаная не дотянула до графика в этой точке."
      },
      {
        uppers: hist[4],
        hideLowers: true,
        gap: { x: lastLo.x, p: lastLo.p, Wu: ideaW(lastLo.x), delta: lastDelta.toFixed(2) },
        answer: answer,
        title: "Стоп: зазор меньше ε",
        body: "δ = W(u₅) − p = " + lastDelta.toFixed(2) + " < ε = " + ideaEps + ". Глубже минимума уже не спрятать. Ответ не оранжевый угол, а лучшая чёрная точка: самая маленькая W.",
        eq: "W(u₅) − p = " + lastDelta.toFixed(2) + " &lt; " + ideaEps
      }
    ];
    let k = 0;
    let look = null;
    if (pills) {
      pills.innerHTML = names.map(function (n, i) {
        return "<button type='button' data-idea-k='" + i + "'>" + (i + 1) + ". " + n + "</button>";
      }).join("");
    }
    function paint() {
      const s = steps[k];
      const U = s.uppers.slice().sort(function (a, b) { return a[0] - b[0]; });
      const lows = (s.bare || s.hideLowers) ? [] : lowersOf(U);
      const pk = lows.length ? pickOf(lows) : null;
      const pickX = pk && s.showPick ? pk.x : null;
      let labelU = U.map(function (u) { return { x: u[0], text: nameU(u[0]) }; });
      if (s.liftLo) labelU.push({ x: s.liftLo.x, text: nameU(s.liftLo.x) });
      if (s.answer) {
        labelU = labelU.filter(function (lb) { return Math.abs(lb.x - s.answer[0]) > 1e-6; });
      }
      fig.innerHTML = svgIdea({
        uppers: U,
        rays: s.rays,
        env: s.env,
        accentX: s.accentX,
        slopes: !!s.slopes,
        lowers: lows,
        pick: pickX,
        look: look,
        bare: !!s.bare,
        foot: !!s.foot,
        lift: s.liftLo ? { x: s.liftLo.x, p: s.liftLo.p, Wu: ideaW(s.liftLo.x) } : null,
        gap: s.gap || null,
        answer: s.answer || null,
        labelU: labelU
      });
      card.innerHTML = "<h3>" + s.title + "</h3><p>" + s.body + "</p>";
      if (s.eq) card.innerHTML += "<p class='eq'>" + s.eq + "</p>";
      let sideH = "";
      if (s.liftLo) {
        const lf = s.liftLo;
        sideH = "<h3>Что на этом x</h3>";
        sideH += "<p class='eq' style='margin:0 0 8px'>x ≈ " + fmt(lf.x, 2) + "</p>";
        sideH += "<p>p ≈ " + fmt(lf.p, 2) + ", высота ломаной, оранжевый кружок.</p>";
        sideH += "<p>W ≈ " + fmt(ideaW(lf.x), 2) + ", значение функции, чёрная точка на графике.</p>";
        sideH += "<p class='note'>W не живёт в оранжевом угле. Мы только взяли у него x. После пробы угол снизу пропадёт, останется верхняя точка.</p>";
      } else if (s.answer) {
        sideH = "<h3>Какую точку берём</h3>";
        sideH += "<p class='eq' style='margin:0 0 8px'>δ = " + lastDelta.toFixed(2) + " &lt; ε = " + ideaEps + "</p>";
        sideH += "<table class='sx tiny'><thead><tr><th>точка</th><th>W</th></tr></thead><tbody>";
        U.slice().sort(function (a, b) { return a[1] - b[1]; }).forEach(function (u) {
          const isAns = Math.abs(u[0] - s.answer[0]) < 1e-6;
          sideH += "<tr><td class='" + (isAns ? "best" : "up") + "'>" + nameU(u[0]) + ", x ≈ " + fmt(u[0], 2) + "</td>";
          sideH += "<td class='" + (isAns ? "best" : "") + "'>" + fmt(u[1], 2) + (isAns ? " · ответ" : "") + "</td></tr>";
        });
        sideH += "</tbody></table>";
        sideH += "<p class='note'>Стоп по зазору в последней пробе. Ответ, лучшая уже посчитанная W. Здесь это " + nameU(s.answer[0]) + ".</p>";
      } else if (s.side) {
        sideH = s.side;
      } else if (!lows.length) {
        sideH = "<h3>Углы ломаной</h3><p class='note' style='margin-top:0'>Нижнего угла пока нет. Он появится, когда сложим галочки в потолок.</p>";
      } else {
        sideH += "<h3>Углы ломаной</h3>";
        sideH += "<p class='note' style='margin:0 0 8px'>Выберите угол в таблице. Берём тот, у кого p меньше.</p>";
        sideH += "<table class='sx tiny'><thead><tr><th>угол</th><th>p</th><th></th></tr></thead><tbody>";
        lows.forEach(function (lo, i) {
          const isPick = pickX != null && Math.abs(lo.x - pickX) < 1e-6;
          const isLook = look === i;
          sideH += "<tr data-lo='" + i + "'" + (isLook || isPick ? " class='" + (isPick && isLook ? "pick" : isPick ? "pick" : "") + "'" : "") + ">";
          sideH += "<td class='" + (isPick ? "pick" : "") + "'>" + (i + 1) + ", x ≈ " + fmt(lo.x, 2) + "</td>";
          sideH += "<td class='" + (isPick ? "pick" : "") + "'>" + fmt(lo.p, 2) + "</td>";
          sideH += "<td><button type='button' data-lo='" + i + "'>" + (isLook ? "выбран" : "выбрать") + "</button></td></tr>";
        });
        sideH += "</tbody></table>";
        if (look == null) {
          sideH += "<p class='note'>Нажмите «выбрать». Правильный угол, с самым маленьким p. Если ничья, левый.</p>";
        } else {
          const lo = lows[look];
          const isPick = pickX != null && Math.abs(lo.x - pickX) < 1e-6;
          sideH += isPick
            ? "<p class='note'>Да. У этого угла самое маленькое p. Здесь будет проба W.</p>"
            : "<p class='note'>Нет. p здесь больше, чем у самого нижнего. Этот угол рисуем, W не считаем.</p>";
        }
      }
      side.innerHTML = sideH;
      if (cnt) cnt.textContent = (k + 1) + " / " + steps.length;
      if (prevB) prevB.disabled = k === 0;
      if (nextB) nextB.disabled = k === steps.length - 1;
      if (pills) {
        pills.querySelectorAll("button").forEach(function (b) {
          b.classList.toggle("on", +b.getAttribute("data-idea-k") === k);
        });
      }
      fig.querySelectorAll("[data-lo]").forEach(function (el) {
        el.addEventListener("click", function (e) {
          e.preventDefault();
          look = +el.getAttribute("data-lo");
          paint();
        });
      });
      side.querySelectorAll("[data-lo]").forEach(function (el) {
        el.addEventListener("click", function (e) {
          e.preventDefault();
          e.stopPropagation();
          look = +el.getAttribute("data-lo");
          paint();
        });
      });
    }
    function go(nk) {
      k = nk;
      look = null;
      paint();
    }
    if (prevB) prevB.onclick = function () { if (k > 0) go(k - 1); };
    if (nextB) nextB.onclick = function () { if (k < steps.length - 1) go(k + 1); };
    if (pills) {
      pills.addEventListener("click", function (e) {
        const b = e.target.closest("button[data-idea-k]");
        if (!b) return;
        go(+b.getAttribute("data-idea-k"));
      });
    }
    paint();
  }

  function svgWork(opt) {
    opt = opt || {};
    const w = opt.w || 880;
    const h = opt.h || 350;
    const padL = 46, padR = 16, padT = 30, padB = 34;
    const x0 = 0, x1 = 4;
    const uppers = (opt.uppers || []).slice().sort(function (a, b) { return a[0] - b[0]; });
    const lowers = opt.lowers || [];
    const pick = opt.pick;
    const look = opt.look;
    const samples = [];
    for (let i = 0; i <= 220; i++) {
      const x = 4 * i / 220;
      samples.push([x, W(x)]);
    }
    const broken = (!opt.bare && uppers.length >= 2) ? brokenPts(uppers) : [];
    let yMin = opt.yMin, yMax = opt.yMax;
    if (yMin == null || yMax == null) {
      const ys = samples.map(function (p) { return p[1]; });
      broken.forEach(function (p) { ys.push(p[1]); });
      if (opt.lift) { ys.push(opt.lift.p, opt.lift.Wu); }
      if (opt.gap) { ys.push(opt.gap.p, opt.gap.Wu); }
      yMin = Math.min.apply(null, ys);
      yMax = Math.max.apply(null, ys);
      const span = Math.max(1.8, yMax - yMin);
      yMin -= span * 0.10;
      yMax += span * 0.14;
    }
    function X(x) { return padL + (x - x0) / (x1 - x0) * (w - padL - padR); }
    function Y(y) { return padT + (yMax - y) / (yMax - yMin) * (h - padT - padB); }
    function pathOf(pts) {
      return pts.map(function (p, i) {
        return (i ? "L" : "M") + X(p[0]).toFixed(1) + " " + Y(p[1]).toFixed(1);
      }).join(" ");
    }
    function pill(px, py, text, kind) {
      const tw = Math.max(36, text.length * 7.05 + 14);
      const th = 20;
      const x = px - tw / 2;
      const y = py - th / 2;
      const fill = kind === "pick" ? "#f3e0c8" : kind === "ok" ? "#e8efd8" : kind === "idle" ? "#fffdf8" : "#e4eef2";
      const stroke = kind === "pick" ? "#b45309" : kind === "ok" ? "#3f6212" : kind === "idle" ? "#a39b90" : "#1f4d63";
      const ink = kind === "pick" ? "#9a3412" : kind === "ok" ? "#3f6212" : kind === "idle" ? "#6b645b" : "#1f4d63";
      return '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + tw.toFixed(1) + '" height="' + th + '" rx="10" fill="' + fill + '" stroke="' + stroke + '"/>'
        + '<text x="' + px.toFixed(1) + '" y="' + (py + 4).toFixed(1) + '" font-size="12" font-weight="650" fill="' + ink + '" text-anchor="middle">' + text + "</text>";
    }

    let g = '<svg viewBox="0 0 ' + w + " " + h + '" role="img">';
    g += '<rect width="' + w + '" height="' + h + '" fill="#fffdf8"/>';
    g += '<g font-family="Segoe UI, Cambria, Georgia, serif">';
    for (let t = 0; t <= 4; t++) {
      g += '<line x1="' + X(t) + '" y1="' + Y(yMin) + '" x2="' + X(t) + '" y2="' + Y(yMax) + '" stroke="#efe8dc"/>';
      g += '<text x="' + X(t) + '" y="' + (h - 8) + '" font-size="12" fill="#6b645b" text-anchor="middle">' + t + "</text>";
    }
    const yTicks = 4;
    for (let i = 0; i <= yTicks; i++) {
      const yv = yMin + (yMax - yMin) * i / yTicks;
      g += '<line x1="' + X(x0) + '" y1="' + Y(yv) + '" x2="' + X(x1) + '" y2="' + Y(yv) + '" stroke="#efe8dc"/>';
      g += '<text x="' + (padL - 8) + '" y="' + (Y(yv) + 4) + '" font-size="11" fill="#6b645b" text-anchor="end">' + fmt(yv, 1) + "</text>";
    }
    g += '<line x1="' + X(x0) + '" y1="' + Y(0) + '" x2="' + X(x1) + '" y2="' + Y(0) + '" stroke="#d9d0c3"/>';
    g += '<path d="' + pathOf(samples) + '" fill="none" stroke="#1c1916" stroke-width="2"/>';
    if (opt.rays) {
      uppers.forEach(function (u) {
        const ray = [];
        for (let i = 0; i <= 80; i++) {
          const x = x0 + (x1 - x0) * i / 80;
          ray.push([x, u[1] - L * Math.abs(x - u[0])]);
        }
        g += '<path d="' + pathOf(ray) + '" fill="none" stroke="#c5d0c2" stroke-width="1.3"/>';
      });
      if (uppers.length >= 2) {
        g += pill(X(1), Y(uppers[0][1] - L * (1 - uppers[0][0])), "склон −L", "up");
        g += pill(X(3), Y(uppers[uppers.length - 1][1] - L * (uppers[uppers.length - 1][0] - 3)), "склон +L", "up");
      }
    }
    if (broken.length) {
      g += '<path d="' + pathOf(broken) + '" fill="none" stroke="#3f6212" stroke-width="2.5"/>';
    }
    uppers.forEach(function (u) {
      g += '<line x1="' + X(u[0]) + '" y1="' + Y(0) + '" x2="' + X(u[0]) + '" y2="' + Y(u[1]) + '" stroke="#cfc6b8" stroke-width="1.1" stroke-dasharray="3 3"/>';
    });
    lowers.forEach(function (lo, i) {
      const isPick = pick != null && Math.abs(lo.x - pick) < 1e-6;
      const isLook = look != null && look === i;
      g += '<line x1="' + X(lo.x) + '" y1="' + Y(lo.p) + '" x2="' + X(lo.x) + '" y2="' + (h - 20) + '" stroke="' + (isPick ? "#b45309" : "#d9d0c3") + '" stroke-width="1.1" stroke-dasharray="3 3"/>';
      g += '<circle class="idea-hit" data-lo="' + i + '" cx="' + X(lo.x) + '" cy="' + Y(lo.p) + '" r="14" fill="transparent"/>';

        showPick: true,
        liftLo: picks[6],
        best: bestOf(hist[6]),
        title: "Проба u₈. Дно правой ямы",
        body: "Последняя строка с p ≈ −2.076. Соседи 17/6 и 4.",
        eq: "x = (61/72 − 2) / 12 + (17/6 + 4) / 2<br>= (−83/72) / 12 + 41/12 = −83/864 + 2952/864 = 2869/864 ≈ 3.321<br>p = 61/72 − 6 · (2869/864 − 17/6) = −299/144 ≈ −2.076",
        eq2: "W(3.321) = ½(3.321 − 2)² + sin(3.321π) ≈ 0.027<br>δ = 0.027 − (−2.076) ≈ 2.103 ≥ 1",
        more: "Мелкая яма: лучше холма, хуже −0.883. Глобальной не стала. Самые глубокие углы снова слева, пара p ≈ −1.730. Это ещё не стоп: сначала посчитаем W в левом из них."
      },
      {
        name: "u₉ ≈ 1.43",
        uppers: hist[7],
        showPick: true,
        liftLo: picks[7],
        best: bestOf(hist[7]),
        title: "Проба u₉. Возврат в левую яму",
        body: "После правой ямы самые глубокие углы снова слева, p ≈ −1.730. Две строки на одной высоте, берём левую. Соседи уже есть в таблице верхних: 7/6 и u₆ ≈ 1.571.",
        eq: "x = (−11/72 − (−0.883)) / 12 + (7/6 + 1.571) / 2 ≈ 1.430<br>p ≈ −1.730<br>W(1.430) = ½(1.430 − 2)² + sin(1.430π) ≈ −0.813",
        eq2: "δ = −0.813 − (−1.730) = 0.917 &lt; 1",
        more: "Зазор впервые меньше ε. Новых проб не будет. u₉ стала верхней, но W ≈ −0.813 хуже уже известной −0.883. На следующем кадре читаем ответ."
      },
      {
        name: "Стоп",
        uppers: hist[8],
        hideLowers: true,
        gap: { x: lastLo.x, p: lastLo.p, Wu: lastW, delta: fmt(lastDelta, 3) },
        answer: answer,
        title: "Стоп. Какую точку записываем",
        body: "Критерий уже выполнен на u₉: δ = 0.917 &lt; ε = 1. Ломаная в этой точке почти дотянулась до графика. Новых углов не меряем.",
        eq: "последняя проба &nbsp; u₉ ≈ 1.430, &nbsp; W ≈ −0.813<br>лучшая верхняя &nbsp; u₆ ≈ 1.571, &nbsp; W ≈ −0.883",
        more: "Ответ не оранжевый угол и не обязательно последняя проба. Берём уже посчитанную точку с наименьшим W, здесь u₆. Истинный минимум около 1.546 и −0.887. Поймать надо с зазором ε, не точкой.",
        extra: pocket("Подробнее: две записи и весь путь",
          "<p>Конспект пишет последнюю пробу: 1.430 и −0.813. Для сдачи удобнее лучшая верхняя. Тот же ε-ответ, ближе к истине.</p>" +
          "<p>Порядок проб: концы 0 и 4, горб 2, склон 7/6, холм 17/6, холм 0.76, дно левой ямы 1.57, холм 2.35, дно правой 3.32, возврат 1.43, стоп.</p>" +
          "<p>Холмы 5 и 7 тоже пришлось измерить. Иначе нижние там оставались глубокими.</p>" +
          "<p>Зазор всегда W минус высота той нижней, которую только что измерили.</p>")
      }
    ];

    let k = 0;
    let look = null;
    if (pills) {
      pills.innerHTML = steps.map(function (s, i) {
        return "<button type='button' data-work-k='" + i + "'>" + (i + 1) + ". " + s.name + "</button>";
      }).join("");
    }

    function paint() {
      const s = steps[k];
      const U = s.uppers.slice().sort(function (a, b) { return a[0] - b[0]; });
      const lows = (s.bare || s.hideLowers) ? [] : lowersOf(U);
      const pk = lows.length ? pickOf(lows) : null;
      const pickX = pk && s.showPick ? pk.x : null;
      let labelU = [];
      if (U.length <= 4) {
        labelU = U.map(function (u) { return { x: u[0], text: nameU(u[0]) }; });
      }
      if (s.liftLo) labelU.push({ x: s.liftLo.x, text: nameU(s.liftLo.x) });
      fig.innerHTML = svgWork({
        uppers: U,
        lowers: lows,
        pick: pickX,
        look: look,
        bare: !!s.bare,
        rays: !!s.rays,
        lift: s.liftLo ? { x: s.liftLo.x, p: s.liftLo.p, Wu: Wpair(s.liftLo.x) } : null,
        gap: s.gap || null,
        answer: s.answer || null,
        best: s.best || null,
        labelU: labelU
      });
      let cardH = "<h3>" + s.title + "</h3><p>" + s.body + "</p>";
      if (s.eq) cardH += "<p class='eq'>" + s.eq + "</p>";
      if (s.eq2) cardH += "<p class='eq'>" + s.eq2 + "</p>";
      if (s.more) cardH += "<p>" + s.more + "</p>";
      if (s.extra) cardH += s.extra;
      card.innerHTML = cardH;

      const pairs = (s.bare || s.hideLowers) ? [] : pairsOf(U);
      function uppersBlock() {
        let h = "<h3>Верхние, из них считаем</h3>";
        h += "<table class='sx tiny'><thead><tr><th>точка</th><th>x</th><th>W</th></tr></thead><tbody>";
        U.slice().sort(function (a, b) { return a[0] - b[0]; }).forEach(function (u) {
          const isAns = (s.answer && Math.abs(u[0] - s.answer[0]) < 1e-6) || (s.best && Math.abs(u[0] - s.best[0]) < 1e-6);
          h += "<tr><td class='" + (isAns ? "best" : "up") + "'>" + nameU(u[0]) + "</td>";
          h += "<td class='" + (isAns ? "best" : "up") + "'>" + pretty(u[0]) + "</td>";
          h += "<td class='" + (isAns ? "best" : "up") + "'>" + pretty(u[1]) + "</td></tr>";
        });
        h += "</tbody></table>";
        return h;
      }
      function cornersBlock() {
        if (!pairs.length) return "";
        let h = "<h3>Углы из соседних верхних</h3>";
        if (!s.derive) {
          h += "<p class='eq' style='margin:0 0 8px'>x = (W<sub>лев</sub> − W<sub>прав</sub>) / 12 + (u<sub>лев</sub> + u<sub>прав</sub>) / 2<br>p = W<sub>лев</sub> − 6(x − u<sub>лев</sub>)</p>";
          h += "<p class='note' style='margin:0 0 8px'>Строка, интервал. W слева и справа из таблицы выше. Берём меньшее p, на ничьей левую.</p>";
        } else {
          h += "<p class='note' style='margin:0 0 8px'>Один интервал, одна строка. Разбор лучей в блоке выше.</p>";
        }
        h += "<table class='sx tiny'><thead><tr><th>интервал</th><th>x</th><th>p</th><th></th></tr></thead><tbody>";
        pairs.forEach(function (pr, i) {
          const isPick = pickX != null && Math.abs(pr.x - pickX) < 1e-6;
          const isLook = look === i;
          h += "<tr data-lo='" + i + "'" + (isPick ? " class='pick'" : "") + ">";
          h += "<td class='" + (isPick ? "pick" : "") + "'>" + pretty(pr.a[0]) + " … " + pretty(pr.b[0]) + "</td>";
          h += "<td class='" + (isPick ? "pick" : "") + "'>" + pretty(pr.x) + "</td>";
          h += "<td class='" + (isPick ? "pick" : "") + "'>" + pretty(pr.p) + "</td>";
          h += "<td><button type='button' data-lo='" + i + "'>" + (isLook ? "выбран" : "выбрать") + "</button></td></tr>";
        });
        h += "</tbody></table>";
        return h;
      }
      let sideH = "";
      if (s.answer) {
        sideH = "<h3>Какую точку берём</h3>";
        sideH += "<p class='eq' style='margin:0 0 8px'>δ = " + fmt(lastDelta, 3) + " &lt; ε = 1</p>";
        sideH += uppersBlock();
        sideH += "<p class='note'>Сверху по x. Ниже те же точки по возрастанию W, отсюда ответ.</p>";
        sideH += "<table class='sx tiny' style='margin-top:8px'><thead><tr><th>точка</th><th>W</th></tr></thead><tbody>";
        U.slice().sort(function (a, b) { return a[1] - b[1]; }).forEach(function (u) {
          const isAns = Math.abs(u[0] - s.answer[0]) < 1e-6;
          sideH += "<tr><td class='" + (isAns ? "best" : "up") + "'>" + nameU(u[0]) + ", x = " + pretty(u[0]) + "</td>";
          sideH += "<td class='" + (isAns ? "best" : "") + "'>" + pretty(u[1]) + (isAns ? " · ответ" : "") + "</td></tr>";
        });
        sideH += "</tbody></table>";
        const lastPr = pairsOf(hist[7]).filter(function (pr) { return Math.abs(pr.x - lastLo.x) < 1e-6; })[0];
        sideH += "<div class='work-sheet'><p class='k'>Последний угол, из него стоп</p>";
        if (lastPr) sideH += explainCross(lastPr);
        sideH += "<p class='eq'>" + explainW(lastLo.x) + "</p>";
        sideH += "<p class='eq'>δ = " + pretty(lastW) + " − (" + pretty(lastLo.p) + ") = " + fmt(lastDelta, 3) + " &lt; 1</p></div>";
        sideH += "<div class='work-mini'>";
        const order = [0, 4].concat(picks.map(function (p) { return p.x; }));
        order.forEach(function (x, i) {
          const cls = Math.abs(x - s.answer[0]) < 1e-4 ? "on" : (i === order.length - 1 ? "last" : "");
          sideH += "<span class='" + cls + "'>" + i + "</span>";
        });
        sideH += "</div>";
        sideH += "<p class='note'>Зелёное, ответ. Рыжее, последняя проба. Номера, порядок проб.</p>";
      } else if (s.bare) {
        sideH = uppersBlock();
        sideH += "<p class='note'>Нижнего угла пока нет. Он появится из этих двух W по формуле пересечения.</p>";
      } else if (s.derive) {
        sideH = uppersBlock();
        sideH += "<p class='note'>Левая строка, это u<sub>лев</sub>. Правая, u<sub>прав</sub>. L = 6 берём отдельно, не из таблицы.</p>";
        sideH += "<div class='work-sheet'>";
        sideH += "<p class='k'>Те же два луча на наших числах</p>";
        sideH += "<p>Левая точка 0, W = 2. Идём вправо, склон −6.</p>";
        sideH += "<p class='eq'>g<sub>лев</sub>(x) = 2 − 6(x − 0) = 2 − 6x</p>";
        sideH += "<p>Правая точка 4, W = 2. Идём влево, склон +6.</p>";
        sideH += "<p class='eq'>g<sub>прав</sub>(x) = 2 − 6(4 − x) = 2 − 24 + 6x = 6x − 22</p>";
        sideH += "<p>В угле высоты равны.</p>";
        sideH += "<p class='eq'>2 − 6x = 6x − 22<br>2 + 22 = 6x + 6x<br>24 = 12x<br>x = 2</p>";
        sideH += "<p class='eq'>p = g<sub>лев</sub>(2) = 2 − 6 · 2 = −10</p>";
        sideH += "<p>W слева и справа одинаковые, поэтому x посередине отрезка.</p>";
        sideH += "</div>";
        sideH += cornersBlock();
      } else {
        sideH = uppersBlock();
        sideH += cornersBlock();
        if (s.liftLo) {
          const lf = s.liftLo;
          const Wu = Wpair(lf.x);
          const del = Wu - lf.p;
          const pr = pairs.filter(function (row) { return Math.abs(row.x - lf.x) < 1e-6; })[0];
          sideH += "<div class='work-sheet'><p class='k'>Эта проба, подстановка</p>";
          if (pr) sideH += explainCross(pr);
          sideH += "<p class='eq'>" + explainW(lf.x) + "</p>";
          sideH += "<p class='eq'>δ = " + pretty(Wu) + " − (" + pretty(lf.p) + ") = " + pretty(del) + (del < EPS ? " &lt; 1" : " ≥ 1") + "</p></div>";
        }
        if (look != null && pairs[look]) {
          const pr = pairs[look];
          const isPick = pickX != null && Math.abs(pr.x - pickX) < 1e-6;
          sideH += "<div class='work-sheet'><p class='k'>" + (isPick ? "Да, эта строка. Самое маленькое p." : "Нет. p больше, чем у самой глубокой строки.") + "</p>";
          if (!s.liftLo || Math.abs(pr.x - s.liftLo.x) > 1e-6) sideH += explainCross(pr);
          else sideH += "<p class='note' style='margin:0'>Разбор этой строки уже в блоке выше.</p>";
          sideH += "</div>";
        } else if (!s.liftLo) {
          sideH += "<p class='note'>Нажмите «выбрать» у строки. Появится подстановка из верхних этой строки.</p>";
        }
      }
      side.innerHTML = sideH;
      if (cnt) cnt.textContent = (k + 1) + " / " + steps.length;
      if (prevB) prevB.disabled = k === 0;
      if (nextB) nextB.disabled = k === steps.length - 1;
      if (pills) {
        pills.querySelectorAll("button").forEach(function (b) {
          b.classList.toggle("on", +b.getAttribute("data-work-k") === k);
        });
      }
      fig.querySelectorAll("[data-lo]").forEach(function (el) {
        el.addEventListener("click", function (e) {
          e.preventDefault();
          look = +el.getAttribute("data-lo");
          paint();
        });
      });
      side.querySelectorAll("[data-lo]").forEach(function (el) {
        el.addEventListener("click", function (e) {
          e.preventDefault();
          e.stopPropagation();
          look = +el.getAttribute("data-lo");
          paint();
        });
      });
    }
    function go(nk) {
      k = nk;
      look = null;
      paint();
    }
    if (prevB) prevB.onclick = function () { if (k > 0) go(k - 1); };
    if (nextB) nextB.onclick = function () { if (k < steps.length - 1) go(k + 1); };
    if (pills) {
      pills.addEventListener("click", function (e) {
        const b = e.target.closest("button[data-work-k]");
        if (!b) return;
        go(+b.getAttribute("data-work-k"));
      });
    }
    paint();
  }

  let i = 0;
  const main = document.getElementById("main");
  const toc = document.getElementById("toc");
  const phase = document.getElementById("phase");
  const counter = document.getElementById("counter");
  const bar = document.getElementById("bar");
  const prev = document.getElementById("prev");
  const next = document.getElementById("next");

  toc.innerHTML = "<h2>Ход практики</h2>" + slides.map(function (s, k) {
    return "<button type='button' data-i='" + k + "'><span class='n'>" + (k + 1) + "</span>" + s.toc + "</button>";
  }).join("");

  function render() {
    const s = slides[i];
    phase.textContent = s.phase;
    counter.textContent = (i + 1) + " / " + slides.length;
    bar.style.width = ((i + 1) / slides.length * 100) + "%";
    prev.disabled = i === 0;
    next.disabled = i === slides.length - 1;
    toc.querySelectorAll("button").forEach(function (b, k) {
      b.classList.toggle("active", k === i);
    });
    document.querySelector(".stage").classList.toggle("wide-slide", !!s.wide);
    main.innerHTML = "<div class='slide" + (s.wide ? " wide" : "") +
      (s.id === "plan" || s.id === "life" || s.id === "idea" || s.id === "work" || s.id === "caveats" ? " geom-slide" : "") +
      (s.id === "work" ? " work-slide" : "") +
      (s.id === "hw" ? " hw-slide" : "") +
      "'><h1>" + s.title + "</h1><p class='lead'>" + s.lead + "</p>" + (s.html || "") + "</div>";
    if (s.onEnter) s.onEnter();
  }

  prev.onclick = function () { if (i > 0) { i--; render(); } };
  next.onclick = function () { if (i < slides.length - 1) { i++; render(); } };
  toc.addEventListener("click", function (e) {
    const b = e.target.closest("button[data-i]");
    if (!b) return;
    i = +b.getAttribute("data-i");
    render();
  });
  document.addEventListener("keydown", function (e) {
    if (e.target.closest("details, summary") && (e.key === " " || e.key === "Enter")) return;
    if (e.target.closest("input, textarea, button.nav-btn")) return;
    const rbNext = document.getElementById("rb-next");
    const rbPrev = document.getElementById("rb-prev");
    if (rbNext && (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ")) {
      e.preventDefault();
      if (!rbNext.disabled) { rbNext.click(); return; }
      if (i < slides.length - 1) { i++; render(); }
      return;
    }
    if (rbPrev && (e.key === "ArrowLeft" || e.key === "PageUp")) {
      e.preventDefault();
      if (!rbPrev.disabled) { rbPrev.click(); return; }
      if (i > 0) { i--; render(); }
      return;
    }
    if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") {
      e.preventDefault();
      if (i < slides.length - 1) { i++; render(); }
    }
    if (e.key === "ArrowLeft" || e.key === "PageUp") {
      e.preventDefault();
      if (i > 0) { i--; render(); }
    }
    if (e.key === "Home") { i = 0; render(); }
    if (e.key === "End") { i = slides.length - 1; render(); }
  });

  render();
})();
</script>
</body>
</html>
