<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Динамическое программирование · многоэтапная задача</title>
  <style>
    :root {
      --bg: #f4efe6;
      --paper: #fffdf8;
      --ink: #1c1916;
      --muted: #6b645b;
      --line: #d9d0c3;
      --accent: #1f4d63;
      --accent-soft: #e4eef2;
      --pivot: #b45309;
      --pivot-soft: #f3e0c8;
      --ok: #3f6212;
      --ok-soft: #e8efd8;
      --bad: #9f1239;
      --shadow: 0 0 0 1px var(--line);
      --f1: #1f4d63;
      --f2: #3f6212;
      --f3: #b45309;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: "Segoe UI", "Iosevka", "Cambria", Georgia, serif;
      background: var(--bg);
      color: var(--ink);
      overflow: hidden;
    }
    .app { display: grid; grid-template-rows: 56px 1fr 44px; height: 100%; }
    header {
      display: flex; align-items: center; gap: 16px;
      padding: 0 18px; border-bottom: 1px solid var(--line); background: var(--paper);
    }
    header .brand { font-weight: 650; }
    header .brand span { color: var(--muted); font-weight: 500; }
    .phase {
      font-size: 13px; color: var(--accent); background: var(--accent-soft);
      padding: 4px 10px; border-radius: 999px; white-space: nowrap;
    }
    .progress { flex: 1; height: 4px; background: var(--line); border-radius: 99px; overflow: hidden; }
    .progress > i { display: block; height: 100%; background: var(--accent); width: 0; }
    .counter { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; min-width: 52px; text-align: right; }
    .nav-btn {
      appearance: none; border: 1px solid var(--line); background: var(--paper); color: var(--ink);
      height: 32px; min-width: 32px; padding: 0 10px; border-radius: 6px; cursor: pointer; font: inherit; font-size: 14px;
    }
    .nav-btn:hover { border-color: var(--accent); color: var(--accent); }
    .nav-btn:disabled { opacity: 0.35; cursor: default; }
    .stage { display: grid; grid-template-columns: 210px 1fr; min-height: 0; }
    .toc { border-right: 1px solid var(--line); padding: 14px 10px; overflow: auto; background: #f7f3eb; }
    .toc h2 {
      margin: 0 8px 10px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--muted); font-weight: 650;
    }
    .toc button {
      display: block; width: 100%; text-align: left; border: 0; background: transparent; color: var(--muted);
      font: inherit; font-size: 13px; padding: 7px 8px; border-radius: 6px; cursor: pointer;
    }
    .toc button.active { background: var(--paper); color: var(--ink); box-shadow: var(--shadow); }
    .toc button .n { display: inline-block; width: 18px; color: var(--muted); font-variant-numeric: tabular-nums; }
    main { overflow: auto; padding: 22px 32px 32px; }
    .slide { max-width: 1180px; }
    .slide h1 { font-size: 26px; font-weight: 650; margin: 0 0 8px; letter-spacing: -0.02em; }
    .lead { color: var(--muted); font-size: 16px; margin: 0 0 14px; line-height: 1.45; }
    .say {
      font-size: 18px; line-height: 1.4; margin: 0 0 14px; padding: 10px 14px;
      background: var(--accent-soft); border-left: 3px solid var(--accent); border-radius: 0 8px 8px 0;
    }
    .geom-layout {
      display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(280px, 420px);
      gap: 16px; align-items: start;
    }
    .geom-story { display: flex; flex-direction: column; gap: 10px; }
    .card {
      background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px;
    }
    .card h3 {
      margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted);
    }
    .card h3.var-title {
      font-size: 20px; text-transform: none; letter-spacing: -0.02em; color: var(--ink); font-weight: 650;
    }
    .stream-pick {
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 0 0 12px;
    }
    .stream-pick input {
      width: 88px; font: inherit; font-size: 16px; color: var(--ink);
      border: 1px solid var(--line); border-radius: 8px; background: var(--paper); padding: 6px 10px;
    }
    .stream-pick .got { font-weight: 650; color: var(--accent); }
    .card p { margin: 0 0 8px; line-height: 1.45; }
    .card p:last-child { margin-bottom: 0; }
    .eq { font-family: "Cambria Math", "Times New Roman", serif; font-size: 20px; line-height: 1.55; }
    .note { font-size: 14px; color: var(--muted); line-height: 1.45; margin-top: 8px; }
    .fig { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
    .fig svg { display: block; width: 100%; height: auto; }
    .geom-legend { display: flex; gap: 14px; flex-wrap: wrap; padding: 8px 2px 0; font-size: 12px; color: var(--muted); }
    .sw { display: inline-block; width: 12px; height: 12px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
    .seg { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
    .idea-pills { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 12px; }
    .idea-pills button {
      appearance: none; border: 1px solid var(--line); background: var(--paper); color: var(--ink);
      border-radius: 99px; padding: 5px 11px; font: inherit; font-size: 13px; cursor: pointer;
    }
    .idea-pills button.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 650; }
    .alg-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(340px, 460px);
      gap: 16px;
      align-items: start;
    }
    .alg-side { display: flex; flex-direction: column; gap: 10px; min-height: 0; }
    .pin {
      background: var(--paper);
      border: 1px solid var(--line);
      border-left: 3px solid var(--accent);
      border-radius: 0 10px 10px 0;
      padding: 8px 14px 6px;
    }
    .pin h3 {
      margin: 0 0 2px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--muted); font-weight: 650;
    }
    .pin math, .card math, .say math, .eq math { font-family: "Cambria Math", "Times New Roman", serif; }
    .dline { padding: 7px 2px 8px; border-top: 1px solid var(--line); }
    .dline:first-of-type { border-top: 0; padding-top: 2px; }
    .dline > math { font-size: 22px; }
    .dline .sayline { margin: 2px 0 0; font-size: 14px; line-height: 1.4; }
    .steps { margin: 0; padding: 0; list-style: none; }
    .steps li { display: grid; grid-template-columns: 28px 1fr; gap: 10px; margin-bottom: 10px; font-size: 15px; line-height: 1.4; }
    .steps .num {
      width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: #fff;
      display: grid; place-items: center; font-size: 13px; font-weight: 650;
    }
    table.sx { border-collapse: collapse; width: 100%; font-size: 14px; background: var(--paper); }
    table.sx th, table.sx td { border: 1px solid var(--line); padding: 4px 8px; text-align: center; }
    table.sx th { background: #f3eee4; font-size: 12px; font-weight: 650; }
    table.sx td.best { background: var(--ok-soft); font-weight: 650; }
    table.sx td.now { background: var(--accent-soft); }
    table.sx tr.now td { background: var(--accent-soft); }
    table.sx tr.now td.best { background: #d5e4c4; }
    table.sx th.from { background: var(--accent-soft); color: var(--accent); }
    table.sx th.tail { background: var(--pivot-soft); color: var(--pivot); }
    table.sx th.both { background: linear-gradient(90deg, var(--accent-soft) 50%, var(--pivot-soft) 50%); }
    table.sx th.write { background: var(--ok-soft); color: var(--ok); }
    table.sx tr.dim td.from,
    table.sx tr.dim td.tail,
    table.sx tr.dim td.write { color: var(--ink); }
    table.sx td.from, table.sx tr.now td.from { background: var(--accent-soft); box-shadow: inset 0 0 0 2px var(--accent); font-weight: 650; }
    table.sx td.tail, table.sx tr.now td.tail { background: var(--pivot-soft); box-shadow: inset 0 0 0 2px var(--pivot); font-weight: 650; }
    table.sx td.write, table.sx tr.now td.write { background: var(--ok-soft); box-shadow: inset 0 0 0 2px var(--ok); font-weight: 650; }
    table.sx td.cand { background: var(--accent-soft); }
    table.sx td.candt { background: var(--pivot-soft); }
    table.sx td.slot { box-shadow: inset 0 0 0 2px var(--ok); }
    table.sx tr.dim td { color: #a39c93; }
    .alg-layout.one { grid-template-columns: minmax(0, 1fr); }
    table.sx td.lab { text-align: left; font-weight: 650; }
    table.sx td.num { font-variant-numeric: tabular-nums; }
    table.sx.mini th, table.sx.mini td { padding: 2px 6px; font-size: 13px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .rebuild-nav {
      display: flex; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 3;
      background: var(--bg); padding: 0 0 8px;
    }
    .rebuild-nav .cnt { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; }
    .rebuild-nav .hint { font-size: 13px; color: var(--muted); }
    .squares { display: flex; gap: 4px; flex-wrap: wrap; margin: 6px 0; }
    .squares i { width: 22px; height: 22px; border-radius: 4px; display: block; }
    .ban { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .ban span {
      font-size: 12px; padding: 3px 8px; border-radius: 99px; background: #f8e8ea; color: var(--bad); border: 1px solid #e8c5cc;
    }
    .codebox {
      font-family: Consolas, "Cascadia Mono", monospace; font-size: 12px; line-height: 1.45;
      background: #f7f3eb; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
      margin: 8px 0 0; white-space: pre; overflow: auto;
    }
    .card a, .note a { color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--line); }
    .slide.hw-slide { max-width: 1240px; }
    .slide.hw-slide h1 { font-size: 24px; }
    .slide.hw-slide .lead { font-size: 15px; margin-bottom: 10px; }
    .hw-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(0, 0.95fr);
      gap: 12px;
      align-items: start;
    }
    .hw-layout .card + .card { margin-top: 10px; }
    .hw-layout .card { padding: 10px 12px; }
    .hw-layout .steps li { margin-bottom: 4px; font-size: 14px; line-height: 1.35; }
    .hw-layout .card p { margin: 0 0 6px; font-size: 14px; line-height: 1.35; }
    .chain { display: flex; align-items: stretch; gap: 0; flex-wrap: wrap; }
    .chain .node, .chain .arrow {
      background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px;
    }
    .chain .arrow {
      border: 0; background: transparent; display: flex; align-items: center; color: var(--accent);
      font-size: 13px; padding: 0 6px; max-width: 120px; line-height: 1.3;
    }
    .tag {
      display: inline-block; font-size: 12px; padding: 1px 7px; border-radius: 99px; margin-right: 4px;
      background: var(--accent-soft); color: var(--accent);
    }
    .setup-board {
      background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px 10px;
    }
    .setup-flow {
      display: grid; grid-template-columns: minmax(0, 1fr) 92px minmax(0, 1.05fr) 92px minmax(0, 1fr);
      gap: 6px; align-items: center;
    }
    .setup-flow .col { text-align: center; min-width: 0; }
    .setup-flow .lbl { font-size: 12px; color: var(--muted); margin-bottom: 6px; min-height: 16px; }
    .setup-flow .arr { font-size: 13px; line-height: 1.35; color: var(--accent); font-weight: 650; }
    .setup-flow .box {
      border: 1px solid var(--line); border-radius: 10px; padding: 8px 6px; background: #fffdf8; min-height: 74px;
    }
    .setup-flow .box b { display: block; font-size: 14px; margin-bottom: 4px; }
    .hot { box-shadow: 0 0 0 2px var(--accent); border-radius: 10px; }
    .chips { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; min-height: 22px; }
    .chips i { width: 16px; height: 16px; border-radius: 4px; display: block; background: var(--accent); }
    .chips i.pay { background: var(--ok); }
    .stage-row { display: flex; gap: 8px; justify-content: center; margin-top: 10px; }
    .stage-row button {
      appearance: none; font: inherit; font-size: 13px; padding: 4px 10px; border-radius: 99px;
      border: 1px solid var(--line); color: var(--muted); background: var(--paper); cursor: pointer;
    }
    .stage-row button.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); font-weight: 650; }
    .stage-row button.done { color: var(--ink); }
    .pathline { margin: 8px 0 0; text-align: center; font-size: 14px; line-height: 1.4; }
    .plan-grid { display: flex; flex-wrap: wrap; gap: 6px; }
    .plan-grid button {
      appearance: none; font: inherit; font-size: 13px; font-variant-numeric: tabular-nums;
      border: 1px solid var(--line); background: var(--paper); color: var(--ink);
      border-radius: 6px; padding: 6px 8px; cursor: pointer;
    }
    .plan-grid button.best { background: var(--ok-soft); font-weight: 650; }
    .plan-grid button.on { outline: 2px solid var(--accent); outline-offset: 1px; }
    .pick td { background: var(--accent-soft); }
    .pick td.best { background: #d5e4c4; }
    .sheet .line { margin: 0 0 4px; padding: 4px 8px; border-radius: 6px; font-size: 14.5px; line-height: 1.35; }
    .sheet .line.wait { opacity: 0.32; }
    .sheet .line.now { background: var(--accent-soft); }
    #setup-say { font-size: 18px; }
    footer {
      border-top: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between;
      padding: 0 16px; background: var(--paper); color: var(--muted); font-size: 12px;
    }
    kbd { font-family: inherit; font-size: 11px; border: 1px solid var(--line); background: #f7f3eb; padding: 1px 5px; border-radius: 4px; }
    @media (max-width: 1100px) {
      .stage { grid-template-columns: 170px 1fr; }
      main { padding: 16px; }
      .geom-layout, .grid-2, .hw-layout, .alg-layout { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">Динамическое программирование <span>· практика 4</span></div>
      <div class="phase" id="phase"></div>
      <div class="progress"><i id="bar"></i></div>
      <div class="counter" id="counter"></div>
      <button class="nav-btn" id="prev" type="button">←</button>
      <button class="nav-btn" id="next" type="button">→</button>
    </header>
    <div class="stage">
      <nav class="toc" id="toc"></nav>
      <main id="main"></main>
    </div>
    <footer>
      <div>Пример: 10 курсов на трёх факультетах. Ответ 115 при плане (8, 1, 1)</div>
      <div><kbd>←</kbd> <kbd>→</kbd> шаг · <kbd>F11</kbd> на проектор</div>
    </footer>
  </div>
<script>
(function () {
  const w = [
    [0, 5, 10, 15, 25, 45, 60, 80, 90],
    [0, 15, 20, 25, 35, 40, 45, 50, 70],
    [0, 10, 10, 30, 35, 45, 55, 65, 75]
  ];
  const fname = ["факультет 1", "факультет 2", "факультет 3"];
  const fshort = ["ф1", "ф2", "ф3"];
  const fcolor = ["#1f4d63", "#3f6212", "#b45309"];

  function stage2(S) {
    const rows = [];
    for (let x = 1; x <= S - 1; x++) {
      const rest = S - x;
      if (x > 8 || rest < 1 || rest > 8) continue;
      rows.push({ x: x, a: w[1][x], rest: rest, b: w[2][rest], sum: w[1][x] + w[2][rest] });
    }
    const best = Math.max.apply(null, rows.map(function (r) { return r.sum; }));
    rows.forEach(function (r) { r.best = r.sum === best; });
    return { S: S, rows: rows, best: best, xs: rows.filter(function (r) { return r.best; }).map(function (r) { return r.x; }) };
  }

  const W3 = {};
  for (let s = 1; s <= 8; s++) W3[s] = w[2][s];
  const pack2 = {};
  for (let s = 2; s <= 9; s++) pack2[s] = stage2(s);

  function stage1rows() {
    const rows = [];
    for (let x = 1; x <= 8; x++) {
      const rest = 10 - x;
      const tail = pack2[rest];
      rows.push({
        x: x, a: w[0][x], rest: rest, tail: tail.best, xs: tail.xs,
        sum: w[0][x] + tail.best
      });
    }
    const best = Math.max.apply(null, rows.map(function (r) { return r.sum; }));
    rows.forEach(function (r) { r.best = r.sum === best; });
    return rows;
  }
  const rows1 = stage1rows();
  const best1 = rows1.filter(function (r) { return r.best; })[0];

  function courseSheet(o) {
    const cols = o.cols || 8;
    const marks = o.marks || {};
    const rows = [
      { id: "f1", label: "1", color: fcolor[0], dim: o.dim && o.dim.f1, val: function (x) { return x <= 8 ? w[0][x] : null; } },
      { id: "f2", label: "2", color: fcolor[1], dim: o.dim && o.dim.f2, val: function (x) { return x <= 8 ? w[1][x] : null; } },
      { id: "f3", label: "3", color: fcolor[2], dim: o.dim && o.dim.f3, val: function (x) { return x <= 8 ? w[2][x] : null; } }
    ];
    if (o.out3) rows.push({ id: "out3", label: "выписали 3", val: function (x) { return x <= 8 ? w[2][x] : null; } });
    if (o.out2) rows.push({
      id: "out2",
      label: "выписали 2",
      val: function (x) { return o.out2[x] === undefined ? null : o.out2[x]; }
    });
    let h = "<h3>Баллы, как в простом примере</h3><table class='sx mini'><thead><tr><th>курсов</th>";
    for (let x = 1; x <= cols; x++) {
      const kinds = {};
      rows.forEach(function (row) {
        const c = marks[row.id] && marks[row.id][x];
        if (c) kinds[c] = true;
      });
      let hc = "";
      if (kinds.from && kinds.tail) hc = "both";
      else if (kinds.from) hc = "from";
      else if (kinds.tail) hc = "tail";
      else if (kinds.write) hc = "write";
      h += "<th class='" + hc + "'>" + x + "</th>";
    }
    h += "</tr></thead><tbody>";
    rows.forEach(function (row) {
      h += "<tr" + (row.dim ? " class='dim'" : "") + "><td class='lab'" + (row.color ? " style='color:" + row.color + "'" : "") + ">" + row.label + "</td>";
      for (let x = 1; x <= cols; x++) {
        const c = (marks[row.id] && marks[row.id][x]) || "";
        const v = row.val(x);
        h += "<td class='num" + (c ? " " + c : "") + "'>" + (v === null || v === undefined ? "·" : v) + "</td>";
      }
      h += "</tr>";
    });
    h += "</tbody></table>";
    if (o.note) h += "<p class='note'>" + o.note + "</p>";
    h += "<p class='note'><span class='sw' style='background:#1f4d63'></span>балл того, кто выбирает сейчас <span class='sw' style='background:#b45309'></span>строка, которую уже выписали <span class='sw' style='background:#3f6212'></span>лучшая сумма, её оставляем</p>";
    return h;
  }

  function incomeTable() {
    let h = "<table class='sx mini'><thead><tr><th>курсов</th>";
    for (let x = 1; x <= 8; x++) h += "<th>" + x + "</th>";
    h += "</tr></thead><tbody>";
    for (let i = 0; i < 3; i++) {
      h += "<tr><td class='lab' style='color:" + fcolor[i] + "'>" + fshort[i] + "</td>";
      for (let x = 1; x <= 8; x++) h += "<td class='num'>" + w[i][x] + "</td>";
      h += "</tr>";
    }
    return h + "</tbody></table>";
  }

  function squares(counts) {
    let h = "<div class='squares'>";
    counts.forEach(function (n, i) {
      for (let k = 0; k < n; k++) h += "<i style='background:" + fcolor[i] + "'></i>";
    });
    return h + "</div>";
  }

  function barsSvg() {
    const W = 640, H = 268, base = 220, top = 48;
    const maxV = 90, barW = 16, gap = 3, groupGap = 36;
    const groupW = 8 * barW + 7 * gap;
    const xStart = (W - (3 * groupW + 2 * groupGap)) / 2;
    let g = "<svg viewBox='0 0 " + W + " " + H + "' role='img'>";
    g += "<rect width='" + W + "' height='" + H + "' fill='#fffdf8'/>";
    g += "<line x1='16' y1='" + base + "' x2='" + (W - 16) + "' y2='" + base + "' stroke='#d9d0c3'/>";
    for (let i = 0; i < 3; i++) {
      const gx = xStart + i * (groupW + groupGap);
      g += "<text x='" + (gx + groupW / 2) + "' y='24' text-anchor='middle' font-size='14' font-weight='650' fill='" + fcolor[i] + "'>" + fname[i] + "</text>";
      for (let x = 1; x <= 8; x++) {
        const bh = (w[i][x] / maxV) * (base - top);
        const bx = gx + (x - 1) * (barW + gap);
        g += "<rect x='" + bx + "' y='" + (base - bh) + "' width='" + barW + "' height='" + bh + "' rx='2' fill='" + fcolor[i] + "'/>";
        g += "<text x='" + (bx + barW / 2) + "' y='" + (base + 16) + "' text-anchor='middle' font-size='11' fill='#6b645b'>" + x + "</text>";
      }
    }
    return g + "</svg>";
  }


  function toMathML(src) {
    let i = 0;
    const rel = { neq: "≠", ne: "≠", ge: "≥", le: "≤", rightarrow: "→" };
    function skip() { while (src[i] === " " || src[i] === "\t") i++; }
    function readName() {
      let name = "";
      while (i < src.length && /[a-zA-Z]/.test(src[i])) name += src[i++];
      return name;
    }
    function parseAtom() {
      skip();
      const ch = src[i];
      if (ch === "{") {
        i++;
        const inner = parseExpr();
        skip();
        if (src[i] === "}") i++;
        return "<mrow>" + inner + "</mrow>";
      }
      if (ch === "(" || ch === "[") {
        const open = ch;
        const close = ch === "(" ? ")" : "]";
        i++;
        const inner = parseExpr();
        skip();
        if (src[i] === close) i++;
        return "<mrow><mo>" + open + "</mo>" + inner + "<mo>" + close + "</mo></mrow>";
      }
      if (ch === "\\") {
        i++;
        const name = readName();
        if (name === "frac") return "<mfrac>" + parseAtom() + parseAtom() + "</mfrac>";
        if (name === "max") return "<mo>max</mo>";
        if (name === "quad") return "<mspace width='1em'></mspace>";
        if (name === "cdot") return "<mo>·</mo>";
        if (name === "varphi" || name === "phi") return "<mi>φ</mi>";
        if (name === "ldots") return "<mo>…</mo>";
        if (rel[name]) return "<mo>" + rel[name] + "</mo>";
        return "<mtext>" + name + "</mtext>";
      }
      if (ch && /[0-9.]/.test(ch)) {
        let n = "";
        while (i < src.length && /[0-9.]/.test(src[i])) n += src[i++];
        return "<mn>" + n + "</mn>";
      }
      if (ch && /[a-zA-Z]/.test(ch)) {
        i++;
        return "<mi>" + ch + "</mi>";
      }
      if (ch === "*") {
        i++;
        return "<mo>*</mo>";
      }
      return "";
    }
    function parseFactor() {
      let node = parseAtom();
      while (true) {
        skip();
        if (src[i] === "^") { i++; node = "<msup>" + node + parseAtom() + "</msup>"; continue; }
        if (src[i] === "_") { i++; node = "<msub>" + node + parseAtom() + "</msub>"; continue; }
        if (src[i] === "*") { i++; node = "<msup>" + node + "<mo>*</mo></msup>"; continue; }
        break;
      }
      return node;
    }
    function parseTerm() {
      skip();
      let lead = "";
      if (src[i] === "-") { i++; lead = "<mo>−</mo>"; }
      else if (src[i] === "+") { i++; lead = "<mo>+</mo>"; }
      let acc = parseFactor();
      while (true) {
        skip();
        if (!src[i]) break;
        if (src[i] === "\\") {
          const save = i;
          i++;
          const name = readName();
          if (name === "cdot") { acc += "<mo>·</mo>" + parseFactor(); continue; }
          if (rel[name] || name === "quad" || name === "max" || name === "ldots") { i = save; break; }
          i = save;
          acc += parseFactor();
          continue;
        }
        if (/[0-9a-zA-Z({\\[]/.test(src[i])) { acc += parseFactor(); continue; }
        break;
      }
      return lead + acc;
    }
    function parseExpr() {
      let acc = parseTerm();
      while (true) {
        skip();
        const ch = src[i];
        if (ch === "+" || ch === "-" || ch === "=" || ch === "," || ch === ">" || ch === "<") {
          i++;
          const shown = ch === "-" ? "−" : ch === ">" ? "&gt;" : ch === "<" ? "&lt;" : ch;
          acc += "<mo>" + shown + "</mo>" + parseTerm();
          continue;
        }
        if (ch === "\\") {
          const save = i;
          i++;
          const name = readName();
          if (rel[name]) { acc += "<mo>" + rel[name] + "</mo>" + parseTerm(); continue; }
          i = save;
          break;
        }
        break;
      }
      return acc;
    }
    const body = parseExpr();
    skip();
    if (i < src.length) return "<span class='note'>" + src + "</span>";
    return "<math xmlns='http://www.w3.org/1998/Math/MathML'>" + body + "</math>";
  }

  function rich(text) {
    return text.split("$").map(function (part, idx) {
      return idx % 2 ? toMathML(part) : part;
    }).join("");
  }

  function bindStepper(steps, paint) {
    let k = 0;
    const pills = document.getElementById("step-pills");
    pills.innerHTML = steps.map(function (s, j) {
      return "<button type='button' data-k='" + j + "'>" + s.pill + "</button>";
    }).join("");
    function go(next) {
      k = next;
      paint(steps[k], k, steps.length);
      document.getElementById("rb-prev").disabled = k === 0;
      document.getElementById("rb-next").disabled = k === steps.length - 1;
      document.getElementById("step-cnt").textContent = (k + 1) + " / " + steps.length;
      pills.querySelectorAll("button").forEach(function (b) {
        b.classList.toggle("on", +b.getAttribute("data-k") === k);
      });
    }
    document.getElementById("rb-prev").onclick = function () { if (k > 0) go(k - 1); };
    document.getElementById("rb-next").onclick = function () { if (k < steps.length - 1) go(k + 1); };
    pills.onclick = function (e) {
      const b = e.target.closest("button[data-k]");
      if (!b) return;
      go(+b.getAttribute("data-k"));
    };
    go(0);
  }

  const next = document.getElementById("next");

  toc.innerHTML = "<h2>Ход практики</h2>" + slides.map(function (s, k) {
    return "<button type='button' data-i='" + k + "'><span class='n'>" + (k + 1) + "</span>" + s.toc + "</button>";
  }).join("");

  function render() {
    const s = slides[i];
    phase.textContent = s.phase;
    counter.textContent = (i + 1) + " / " + slides.length;
    bar.style.width = ((i + 1) / slides.length * 100) + "%";
    prev.disabled = i === 0;
    next.disabled = i === slides.length - 1;
    toc.querySelectorAll("button").forEach(function (b, k) { b.classList.toggle("active", k === i); });
    main.innerHTML = "<div class='slide" + (s.id === "hw" ? " hw-slide" : "") + "'><h1>" + s.title + "</h1><p class='lead'>" + s.lead + "</p>" + s.html + "</div>";
    if (s.onEnter) s.onEnter();
    const active = toc.querySelector("button.active");
    if (active) active.scrollIntoView({ block: "nearest" });
    main.scrollTop = 0;
  }

  prev.onclick = function () { if (i > 0) { i--; render(); } };
  next.onclick = function () { if (i < slides.length - 1) { i++; render(); } };
  toc.onclick = function (e) {
    const b = e.target.closest("button[data-i]");
    if (!b) return;
    i = +b.getAttribute("data-i");
    render();
  };
  document.addEventListener("keydown", function (e) {
    if (e.target.closest("input, textarea")) return;
    const rbNext = document.getElementById("rb-next");
    const rbPrev = document.getElementById("rb-prev");
    if ((e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") && rbNext) {
      e.preventDefault();
      if (!rbNext.disabled) { rbNext.click(); return; }
      if (i < slides.length - 1) { i++; render(); }
      return;
    }
    if ((e.key === "ArrowLeft" || e.key === "PageUp") && rbPrev) {
      e.preventDefault();
      if (!rbPrev.disabled) { rbPrev.click(); return; }
      if (i > 0) { i--; render(); }
      return;
    }
    if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") {
      e.preventDefault();
      if (i < slides.length - 1) { i++; render(); }
    }
    if (e.key === "ArrowLeft" || e.key === "PageUp") {
      e.preventDefault();
      if (i > 0) { i--; render(); }
    }
  });

  const start = new URLSearchParams(location.search).get("s");
  if (start) {
    const n = parseInt(start, 10);
    if (!isNaN(n)) i = Math.max(0, Math.min(slides.length - 1, n - 1));
  }
  render();
})();
</script>
</body>
</html>
