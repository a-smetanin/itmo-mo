<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Множители Лагранжа · условный экстремум</title>
  <style>
    :root {
      --bg: #f4efe6;
      --paper: #fffdf8;
      --ink: #1c1916;
      --muted: #6b645b;
      --line: #d9d0c3;
      --accent: #1f4d63;
      --accent-soft: #e4eef2;
      --pivot: #b45309;
      --pivot-soft: #f3e0c8;
      --ok: #3f6212;
      --ok-soft: #e8efd8;
      --bad: #9f1239;
      --shadow: 0 0 0 1px var(--line);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: "Segoe UI", "Iosevka", "Cambria", Georgia, serif;
      background: var(--bg);
      color: var(--ink);
      overflow: hidden;
    }
    .app { display: grid; grid-template-rows: 56px 1fr 44px; height: 100%; }
    header {
      display: flex; align-items: center; gap: 16px;
      padding: 0 18px; border-bottom: 1px solid var(--line); background: var(--paper);
    }
    header .brand { font-weight: 650; }
    header .brand span { color: var(--muted); font-weight: 500; }
    .phase {
      font-size: 13px; color: var(--accent); background: var(--accent-soft);
      padding: 4px 10px; border-radius: 999px; white-space: nowrap;
    }
    .progress { flex: 1; height: 4px; background: var(--line); border-radius: 99px; overflow: hidden; }
    .progress > i { display: block; height: 100%; background: var(--accent); width: 0; }
    .counter { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; min-width: 52px; text-align: right; }
    .nav-btn {
      appearance: none; border: 1px solid var(--line); background: var(--paper); color: var(--ink);
      height: 32px; min-width: 32px; padding: 0 10px; border-radius: 6px; cursor: pointer; font: inherit; font-size: 14px;
    }
    .nav-btn:hover { border-color: var(--accent); color: var(--accent); }
    .nav-btn:disabled { opacity: 0.35; cursor: default; }
    .stage { display: grid; grid-template-columns: 210px 1fr; min-height: 0; }
    .toc { border-right: 1px solid var(--line); padding: 14px 10px; overflow: auto; background: #f7f3eb; }
    .toc h2 {
      margin: 0 8px 10px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--muted); font-weight: 650;
    }
    .toc button {
      display: block; width: 100%; text-align: left; border: 0; background: transparent; color: var(--muted);
      font: inherit; font-size: 13px; padding: 7px 8px; border-radius: 6px; cursor: pointer;
    }
    .toc button.active { background: var(--paper); color: var(--ink); box-shadow: var(--shadow); }
    .toc button .n { display: inline-block; width: 18px; color: var(--muted); font-variant-numeric: tabular-nums; }
    main { overflow: auto; padding: 22px 32px 32px; }
    .slide { max-width: 1180px; }
    .slide h1 { font-size: 26px; font-weight: 650; margin: 0 0 8px; letter-spacing: -0.02em; }
    .lead { color: var(--muted); font-size: 16px; margin: 0 0 14px; line-height: 1.45; }
    .say {
      font-size: 18px; line-height: 1.4; margin: 0 0 14px; padding: 10px 14px;
      background: var(--accent-soft); border-left: 3px solid var(--accent); border-radius: 0 8px 8px 0;
    }
    .geom-layout {
      display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(280px, 360px);
      gap: 16px; align-items: start;
    }
    .geom-story { display: flex; flex-direction: column; gap: 10px; }
    .card {
      background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px;
    }
    .card h3 {
      margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted);
    }
    .card p { margin: 0 0 8px; line-height: 1.45; }
    .card p:last-child { margin-bottom: 0; }
    .eq { font-family: "Cambria Math", "Times New Roman", serif; font-size: 20px; line-height: 1.55; }
    .note { font-size: 14px; color: var(--muted); line-height: 1.45; margin-top: 8px; }
    .fig { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
    .fig svg { display: block; width: 100%; height: auto; }
    .geom-legend { display: flex; gap: 14px; flex-wrap: wrap; padding: 8px 2px 0; font-size: 12px; color: var(--muted); }
    .sw { display: inline-block; width: 12px; height: 12px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
    .seg { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
    .seg button {
      appearance: none; border: 1px solid var(--line); background: var(--paper); color: var(--ink);
      font: inherit; font-size: 13px; padding: 6px 10px; border-radius: 6px; cursor: pointer;
    }
    .seg button.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
    .range-row { display: grid; grid-template-columns: 28px 1fr 64px; gap: 10px; align-items: center; margin: 8px 0; }
    .range-row input[type="range"] { width: 100%; }
    .big { font-family: "Cambria Math", "Times New Roman", serif; font-size: 32px; font-weight: 650; line-height: 1.2; margin: 4px 0; }
    .idea-pills { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 12px; }
    .idea-pills button {
      appearance: none; border: 1px solid var(--line); background: var(--paper); color: var(--ink);
      border-radius: 99px; padding: 5px 11px; font: inherit; font-size: 13px; cursor: pointer;
    }
    .idea-pills button.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 650; }
    .idea-pills.algo button { font-size: 12px; padding: 4px 8px; }
    .alg-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(420px, 540px);
      gap: 16px;
      align-items: start;
    }
    .alg-side {
      display: flex; flex-direction: column; gap: 10px; min-height: 0;
      max-height: calc(100vh - 230px);
    }
    .pin {
      background: var(--paper);
      border: 1px solid var(--line);
      border-left: 3px solid var(--accent);
      border-radius: 0 10px 10px 0;
      padding: 8px 14px 6px;
    }
    .pin h3 {
      margin: 0 0 2px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      font-weight: 650;
    }
    .pin h3.pin-next { margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--line); }
    .pin math { font-size: 18px; font-family: "Cambria Math", "Times New Roman", serif; }
    .pin .dline { padding: 1px 0 2px; border-top: 0; }
    .card.deriv { flex: 1; min-height: 0; overflow: auto; }
    .deriv h3 {
      text-transform: none;
      letter-spacing: 0;
      font-size: 17px;
      color: var(--ink);
      font-weight: 650;
    }
    .deriv .step-k { margin: 0 0 6px; font-size: 12px; color: var(--muted); }
    .dline { padding: 7px 2px 8px; border-top: 1px solid var(--line); }
    .deriv .dline { padding: 4px 2px 5px; }
    .deriv .dline > math { font-size: 20px; }
    .dline:first-of-type { border-top: 0; padding-top: 2px; }
    .dline > math { font-size: 22px; }
    .dline .sayline { margin: 2px 0 0; font-size: 14px; line-height: 1.4; }
    .dline .sayline math { font-size: 16px; }
    .math-bad { color: var(--bad); font-family: Consolas, monospace; font-size: 13px; }
    .deriv math { font-family: "Cambria Math", "Times New Roman", serif; }
    .rebuild-nav {
      display: flex; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 3;
      background: var(--bg); padding: 0 0 8px;
    }
    .rebuild-nav .cnt { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; }
    .rebuild-nav .hint { font-size: 13px; color: var(--muted); }
    .sheet .line { margin: 0 0 6px; }
    .sheet .line.wait { opacity: 0.28; }
    .sheet .line.now { background: var(--accent-soft); border-radius: 6px; padding: 2px 8px; }
    table.sx { border-collapse: collapse; width: 100%; font-size: 14px; background: var(--paper); }
    table.sx th, table.sx td { border: 1px solid var(--line); padding: 3px 8px; text-align: left; }
    table.sx th { background: #f3eee4; font-size: 12px; font-weight: 650; }
    table.sx td.best { background: var(--ok-soft); font-weight: 650; }
    table.sx td.badc { background: #f8e8ea; }
    table.sx td.num { font-variant-numeric: tabular-nums; color: var(--muted); width: 28px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .steps { margin: 0; padding: 0; list-style: none; }
    .steps li { display: grid; grid-template-columns: 28px 1fr; gap: 10px; margin-bottom: 10px; font-size: 15px; line-height: 1.4; }
    .steps ul { margin: 6px 0 0; padding-left: 18px; }
    .steps ul li { display: list-item; margin: 0 0 3px; font-size: 14px; }
    .steps .num {
      width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: #fff;
      display: grid; place-items: center; font-size: 13px; font-weight: 650;
    }
    .ban { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .ban span {
      font-size: 12px; padding: 3px 8px; border-radius: 99px; background: #f8e8ea; color: var(--bad); border: 1px solid #e8c5cc;
    }
    .codebox {
      font-family: Consolas, "Cascadia Mono", monospace; font-size: 12.5px; line-height: 1.5;
      background: #f7f3eb; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
      margin: 8px 0 0; white-space: pre; overflow: auto;
    }
    .card a, .note a { color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--line); }
    .slide.hw-slide { max-width: 1240px; }
    .slide.hw-slide h1 { font-size: 24px; }
    .slide.hw-slide .lead { font-size: 15px; margin-bottom: 10px; }
    .hw-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.08fr) minmax(0, 0.92fr);
      gap: 12px;
      align-items: start;
    }
    .hw-layout .card + .card { margin-top: 10px; }
    .hw-layout .card { padding: 10px 12px; }
    .hw-layout .steps li { margin-bottom: 4px; font-size: 14px; line-height: 1.35; }
    .hw-layout .card p { margin: 0 0 6px; font-size: 14px; line-height: 1.35; }
    .hw-layout .codebox { font-size: 11.5px; line-height: 1.45; padding: 8px 10px; }
    .hw-vars { margin-top: 12px; }
    .hw-legend {
      display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center;
      margin: 0 0 8px; font-size: 13px; color: var(--muted);
    }
    .pill-k {
      display: inline-block; min-width: 28px; text-align: center;
      font-size: 12px; font-weight: 650; padding: 2px 8px; border-radius: 99px;
      font-variant-numeric: tabular-nums;
    }
    .k-both { background: var(--ok-soft); color: var(--ok); }
    .k-min { background: var(--pivot-soft); color: var(--pivot); }
    table.sx td.fml {
      font-family: "Cambria Math", "Times New Roman", serif;
      font-size: 16px;
      white-space: nowrap;
    }
    table.sx td.kind { width: 52px; }
    footer {
      border-top: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between;
      padding: 0 16px; background: var(--paper); color: var(--muted); font-size: 12px;
    }
    kbd { font-family: inherit; font-size: 11px; border: 1px solid var(--line); background: #f7f3eb; padding: 1px 5px; border-radius: 4px; }
    @media (max-width: 1100px) {
      .stage { grid-template-columns: 170px 1fr; }
      main { padding: 16px; }
      .geom-layout, .grid-2, .hw-layout { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">Множители Лагранжа <span>· практика 3</span></div>
      <div class="phase" id="phase"></div>
      <div class="progress"><i id="bar"></i></div>
      <div class="counter" id="counter"></div>
      <button class="nav-btn" id="prev" type="button">←</button>
      <button class="nav-btn" id="next" type="button">→</button>
    </header>
    <div class="stage">
      <nav class="toc" id="toc"></nav>
      <main id="main"></main>
    </div>
    <footer>
      <div>Два примера: x² + y² при x + y = 2 и xy на окружности x² + y² = 1</div>
      <div><kbd>←</kbd> <kbd>→</kbd> шаг · <kbd>F11</kbd> на проектор</div>
    </footer>
  </div>
<script>
(function () {
  const RT = Math.SQRT2;

  function plane(opt) {
    const w = opt.w || 700;
    const h = opt.h || 520;
    const padL = 42, padR = 16, padT = 14, padB = 30;
    const x0 = opt.x0, x1 = opt.x1, y0 = opt.y0, y1 = opt.y1;
    const s = Math.min((w - padL - padR) / (x1 - x0), (h - padT - padB) / (y1 - y0));
    const ox = padL + ((w - padL - padR) - s * (x1 - x0)) / 2;
    const oy = padT + ((h - padT - padB) - s * (y1 - y0)) / 2;
    function X(x) { return ox + (x - x0) * s; }
    function Y(y) { return oy + (y1 - y) * s; }
    let g = '<svg viewBox="0 0 ' + w + " " + h + '" role="img">';
    g += '<rect width="' + w + '" height="' + h + '" fill="#fffdf8"/>';
    g += '<g font-family="Cambria Math, Segoe UI, Cambria, Georgia, serif">';
    for (let t = Math.ceil(x0); t <= Math.floor(x1); t++) {
      g += '<line x1="' + X(t) + '" y1="' + Y(y0) + '" x2="' + X(t) + '" y2="' + Y(y1) + '" stroke="#efe8dc"/>';
      if (t !== 0) g += '<text x="' + X(t) + '" y="' + (Y(0) + 15) + '" font-size="11" fill="#6b645b" text-anchor="middle">' + t + "</text>";
    }
    for (let t = Math.ceil(y0); t <= Math.floor(y1); t++) {
      g += '<line x1="' + X(x0) + '" y1="' + Y(t) + '" x2="' + X(x1) + '" y2="' + Y(t) + '" stroke="#efe8dc"/>';
      if (t !== 0) g += '<text x="' + (X(0) - 6) + '" y="' + (Y(t) + 4) + '" font-size="11" fill="#6b645b" text-anchor="end">' + t + "</text>";
    }
    if (y0 < 0 && y1 > 0) g += '<line x1="' + X(x0) + '" y1="' + Y(0) + '" x2="' + X(x1) + '" y2="' + Y(0) + '" stroke="#d9d0c3"/>';
    if (x0 < 0 && x1 > 0) g += '<line x1="' + X(0) + '" y1="' + Y(y0) + '" x2="' + X(0) + '" y2="' + Y(y1) + '" stroke="#d9d0c3"/>';
    g += '<text x="' + (X(x1) - 2) + '" y="' + (Y(0) - 8) + '" font-size="13" fill="#6b645b" text-anchor="end">x</text>';
    g += '<text x="' + (X(0) + 8) + '" y="' + (Y(y1) + 13) + '" font-size="13" fill="#6b645b">y</text>';
    (opt.polys || []).forEach(function (p) {
      if (!p.pts || p.pts.length < 3) return;
      const d = p.pts.map(function (q, i) { return (i ? "L" : "M") + X(q[0]).toFixed(1) + " " + Y(q[1]).toFixed(1); }).join(" ") + " Z";
      g += '<path d="' + d + '" fill="' + (p.fill || "#e4eef2") + '" fill-opacity="' + (p.opacity == null ? 0.72 : p.opacity) + '" stroke="none"/>';
    });

    function lineSum(b, stroke, width) {
      const xa = Math.max(x0, b - y1);
      const xb = Math.min(x1, b - y0);
      g += '<line x1="' + X(xa) + '" y1="' + Y(b - xa) + '" x2="' + X(xb) + '" y2="' + Y(b - xb) + '" stroke="' + stroke + '" stroke-width="' + width + '"/>';
    }
    (opt.circles || []).forEach(function (c) {
      g += '<circle cx="' + X(c.cx || 0) + '" cy="' + Y(c.cy || 0) + '" r="' + (c.r * s) + '" fill="' + (c.fill || "none") + '" fill-opacity="' + (c.fillOpacity == null ? 1 : c.fillOpacity) + '" stroke="' + (c.stroke || "#1c1916") + '" stroke-width="' + (c.width || 2.2) + '" opacity="' + (c.opacity == null ? 1 : c.opacity) + '"/>';
    });
    (opt.lines || []).forEach(function (ln) { lineSum(ln.b, ln.stroke || "#1f4d63", ln.width || 2.4); });
    (opt.dashed || []).forEach(function (d) {
      g += '<line x1="' + X(d.x1) + '" y1="' + Y(d.y1) + '" x2="' + X(d.x2) + '" y2="' + Y(d.y2) + '" stroke="' + (d.stroke || "#b45309") + '" stroke-width="1.6" stroke-dasharray="5 4"/>';
    });
    (opt.paths || []).forEach(function (p) {
      if (!p.pts || !p.pts.length) return;
      const d = p.pts.map(function (q, i) { return (i ? "L" : "M") + X(q[0]).toFixed(1) + " " + Y(q[1]).toFixed(1); }).join(" ");
      g += '<path d="' + d + '" fill="none" stroke="' + (p.stroke || "#b45309") + '" stroke-width="' + (p.width || 1.7) + '"/>';
    });
    function arrow(x1, y1, x2, y2, color) {
      const px1 = X(x1), py1 = Y(y1), px2 = X(x2), py2 = Y(y2);
      const ang = Math.atan2(py2 - py1, px2 - px1);
      const ah = 10;
      g += '<line x1="' + px1 + '" y1="' + py1 + '" x2="' + px2 + '" y2="' + py2 + '" stroke="' + color + '" stroke-width="2.4"/>';
      g += '<polygon points="' + px2 + "," + py2 + " " + (px2 - ah * Math.cos(ang - 0.4)) + "," + (py2 - ah * Math.sin(ang - 0.4)) + " " + (px2 - ah * Math.cos(ang + 0.4)) + "," + (py2 - ah * Math.sin(ang + 0.4)) + '" fill="' + color + '"/>';
    }
    (opt.arrows || []).forEach(function (a) { arrow(a.x1, a.y1, a.x2, a.y2, a.color); });
    (opt.points || []).forEach(function (p) {
      g += '<circle cx="' + X(p.x) + '" cy="' + Y(p.y) + '" r="' + (p.r || 6) + '" fill="' + (p.fill || "#1c1916") + '"' +
        (p.stroke ? ' stroke="' + p.stroke + '" stroke-width="2"' : "") + "/>";
    });
    (opt.marks || []).forEach(function (m) {
      g += '<text x="' + (X(m.x) + (m.dx || 8)) + '" y="' + (Y(m.y) + (m.dy || -8)) + '" font-size="' + (m.size || 14) + '" font-weight="650" fill="' + (m.fill || "#1c1916") + '" stroke="#fffdf8" stroke-width="3.5" paint-order="stroke fill" stroke-linejoin="round">' + m.text + "</text>";
    });
    g += "</g></svg>";
    return g;
  }

  function hits(r) {
    const disc = 2 * r * r - 4;
    if (disc < -0.04) return [];
    if (disc < 0.04) return [{ x: 1, y: 1 }];
    const h = Math.sqrt(disc) / 2;
    return [{ x: 1 - h, y: 1 + h }, { x: 1 + h, y: 1 - h }];
  }

  function levelFig(r, touchForce, withArrows) {
    const pts = hits(r);
    const touch = touchForce || pts.length === 1;
    const drawR = touch ? RT : r;
    const dots = [{ x: 0, y: 0, fill: "#9f1239", r: 5 }];
    const marks = [{ x: 0, y: 0, text: "(0, 0)", fill: "#9f1239", dx: -46, dy: 16 }];
    const arrows = [];
    if (touch) {
      dots.push({ x: 1, y: 1, fill: "#3f6212", r: 7 });
      marks.push({ x: 1, y: 1, text: "(1, 1)", fill: "#3f6212", dx: 12, dy: 18 });
      if (withArrows) {
        arrows.push({ x1: 1, y1: 1, x2: 2.15, y2: 2.15, color: "#3f6212" });
        arrows.push({ x1: 1, y1: 1, x2: 1.6, y2: 1.6, color: "#1f4d63" });
        marks.push({ x: 2.15, y: 2.15, text: "∇f", fill: "#3f6212", dx: 6, dy: -4 });
        marks.push({ x: 0.15, y: 1.85, text: "∇h", fill: "#1f4d63", dx: -8, dy: -2 });
      }
    } else {
      pts.forEach(function (p) { dots.push({ x: p.x, y: p.y, fill: "#b45309", r: 5 }); });
    }
    return plane({
      x0: -3.4, x1: 4.2, y0: -3.4, y1: 4.2, h: 460,
      lines: [{ b: 2 }],
      circles: [{ r: drawR }],
      arrows: arrows, points: dots, marks: marks
    });
  }

  function toMathML(src) {
    let i = 0;
    const rel = { neq: "≠", ne: "≠", ge: "≥", le: "≤" };
    function skip() { while (src[i] === " " || src[i] === "\t") i++; }
    function readName() {
      let name = "";
      while (i < src.length && /[a-zA-Z]/.test(src[i])) name += src[i++];
      return name;
    }
    function parseAtom() {
      skip();
      const ch = src[i];
      if (ch === "{") {
        i++;
        const inner = parseExpr();
        skip();
        if (src[i] === "}") i++;
        return "<mrow>" + inner + "</mrow>";
      }
      if (ch === "(" || ch === "[") {
        const open = ch;
        const close = ch === "(" ? ")" : "]";
        i++;
        const inner = parseExpr();
        skip();
        if (src[i] === close) i++;
        return "<mrow><mo>" + open + "</mo>" + inner + "<mo>" + close + "</mo></mrow>";
      }
      if (ch === "\\") {
        i++;
        const name = readName();
        if (name === "frac") return "<mfrac>" + parseAtom() + parseAtom() + "</mfrac>";
        if (name === "sqrt") return "<msqrt>" + parseAtom() + "</msqrt>";
        if (name === "abs") return "<mrow><mo>|</mo>" + parseAtom() + "<mo>|</mo></mrow>";
        if (name === "quad") return "<mspace width=\"1em\"></mspace>";
        if (name === "lambda") return "<mi>λ</mi>";
        if (name === "mu") return "<mi>μ</mi>";
        if (name === "partial") return "<mi>∂</mi>";
        if (name === "nabla") return "<mi>∇</mi>";
        if (name === "cdot") return "<mo>·</mo>";
        if (name === "times") return "<mo>×</mo>";
        if (name === "pm") return "<mo>\u00b1</mo>";
        if (rel[name]) return "<mo>" + rel[name] + "</mo>";

      }
      if (ch && /[0-9.]/.test(ch)) {
        let n = "";

        return "<mn>" + n + "</mn>";
      }
      if (ch && /[a-zA-Z]/.test(ch)) {
        i++;
        return "<mi>" + ch + "</mi>";
      }
      return "";
    }
    function parseFactor() {
      let node = parseAtom();
      while (true) {
        skip();
        if (src[i] === "^") { i++; node = "<msup>" + node + parseAtom() + "</msup>"; continue; }
        if (src[i] === "_") { i++; node = "<msub>" + node + parseAtom() + "</msub>"; continue; }
        break;
      }
      return node;
    }
    function parseTerm() {
      skip();
      let lead = "";
      if (src[i] === "-") { i++; lead = "<mo>\u2212</mo>"; }
      else if (src[i] === "+") { i++; lead = "<mo>+</mo>"; }
      let acc = parseFactor();
      while (true) {
        skip();
        if (!src[i]) break;
        if (src[i] === "\\") {
          const save = i;
          i++;
          const name = readName();
          if (name === "cdot" || name === "times") {
            acc += "<mo>" + (name === "cdot" ? "·" : "×") + "</mo>" + parseFactor();
            continue;
          }
          if (rel[name] || name === "quad") { i = save; break; }
          i = save;
          acc += parseFactor();
          continue;
        }
        if (/[0-9a-zA-Z({\\[]/.test(src[i])) { acc += parseFactor(); continue; }
        break;
      }
      return lead + acc;
    }
    function parseExpr() {
      let acc = parseTerm();
      while (true) {
        skip();
        const ch = src[i];
        if (ch === "+" || ch === "-" || ch === "=" || ch === "," || ch === "/" || ch === ">" || ch === "<") {
          i++;
          const shown = ch === "-" ? "\u2212" : ch === ">" ? "&gt;" : ch === "<" ? "&lt;" : ch;
          acc += "<mo>" + shown + "</mo>" + parseTerm();
          continue;
        }
        if (ch === "\\") {
          const save = i;
          i++;
          const name = readName();
          if (rel[name]) { acc += "<mo>" + rel[name] + "</mo>" + parseTerm(); continue; }
          i = save;
          break;
        }
        break;
      }
      return acc;
    }
    const body = parseExpr();
    skip();
    if (i < src.length) return "<span class=\"math-bad\">" + src + "</span>";
    return "<math xmlns=\"http://www.w3.org/1998/Math/MathML\">" + body + "</math>";
  }

        function hyp(c, color, width) {
          const chunks = [];
          let pts = [];
          const lim = 1.7;
          for (let i = 0; i <= 240; i++) {
            const x = -lim + (2 * lim * i) / 240;
            if (Math.abs(x) < 0.08) {
              if (pts.length > 1) chunks.push(pts);
              pts = [];
              continue;
            }
            const y = c / x;
            if (y < -lim || y > lim) {
              if (pts.length > 1) chunks.push(pts);
              pts = [];
              continue;
            }
            pts.push([x, y]);

            <h3>Что сдать</h3>
            <ol class="steps">
              <li><span class="num">1</span><div>Вручную пройти шаги с пары по своему варианту. Записать f и h = 0, проверить, что множество непустое и градиент ограничения не нулевой. Собрать L с плюсом перед множителем, выписать полную систему, найти все действительные решения и подставить каждое в ограничение и в f. Глобальность обосновать отдельно: на окружности сравнить значения во всех точках, на прямой подставить переменную и посмотреть поведение вдали, как с 2(t − 1)² + 2.</div></li>
              <li><span class="num">2</span><div>Проверить это решение программным солвером. Программа сама дифференцирует L, собирает систему и печатает все корни, невязку ограничения и значение f. Готовый оптимизатор здесь не засчитывается.</div></li>
              <li><span class="num">3</span><div>В отчёте два решения рядом: ручное и проверенное солвером. По ним должны читаться одни и те же точки, множители и f. В шапке ФИО, поток и номер варианта.</div></li>
              <li><span class="num">4</span><div>К отчёту приложить все исходники, которыми считали. В программе нет заранее вписанного ответа.</div></li>
            </ol>
            <p class="note">Фото тетради принимаются. Материалы Савлия Лаврентьева с методическим материалом: <a href="https://drive.google.com/drive/folders/1aEophG82jjbuG6wTOMdYgbbi4xBdRf7l" target="_blank" rel="noopener">папка на Google Диске</a>.</p>
          </div>
          <div>
            <div class="card">
              <h3>Баллы из методички, сумма 10</h3>
              <p>По 0,5: постановка, регулярность, функция Лагранжа, полнота системы, все кандидаты, проверка допустимости, классификация. Глобальность 1. Программа 1. Совпадение ручного и программного ответа 0,5. Вопросы на защите 4.</p>
              <p>Выше 5 не ставят без ручного решения, с одним корнем из нескольких, с заранее напечатанной точкой, без подстановки в ограничение или с готовым оптимизатором.</p>
              <div class="ban">
                <span>scipy.optimize.minimize</span>
                <span>готовый солвер</span>
                <span>print заранее известной точки</span>
                <span>один корень из нескольких</span>
              </div>
            </div>
          </div>
        </div>
        <div class="card hw-vars">
          <h3>Варианты</h3>
          <div class="hw-legend">
            <span><span class="pill-k k-both">оба</span> окружность, минимум и максимум, как с xy</span>
            <span><span class="pill-k k-min">min</span> прямая, минимум и есть ли максимум, как с x² + y²</span>
          </div>
          <table class="sx" id="var-table"></table>
          <p class="note">Варианты 1-6 повторяют второй пример, 7-12 первый. Ограничение и цель другие, шаги те же.</p>
        </div>
        <div class="card" style="margin-top:12px">
          <h3>Тот же пример в SymPy</h3>
          <div class="codebox">import sympy as sp
x, y = sp.symbols("x y", real=True)
lam = sp.symbols("lam", real=True)
f = x**2 + y**2
constraints = [x + y - 2]
L = f + lam * constraints[0]
equations = [sp.diff(L, v) for v in (x, y)] + constraints
for sol in sp.solve(equations, [x, y, lam], dict=True):
    pt = {x: sol[x], y: sol[y]}
    print(sol, sp.simplify(constraints[0].subs(pt)), sp.simplify(f.subs(pt)))</div>
          <p class="note">Ожидаемая печать: x = 1, y = 1, λ = −2, невязка 0, f = 2. Минимум в эту печать не входит: его даёт подстановка y = 2 − x.</p>
        </div>`,
      onEnter: function () {
        const rows = [
          ["1", "оба", "xy", "x² + y² = 2"],
          ["2", "оба", "xy", "x² + y² = 8"],
          ["3", "оба", "x + y", "x² + y² = 2"],
          ["4", "оба", "x − y", "x² + y² = 2"],
          ["5", "оба", "2x − y", "x² + y² = 5"],
          ["6", "оба", "3x + 4y", "x² + y² = 25"],
          ["7", "min", "x² + y²", "x + y = 4"],
          ["8", "min", "x² + y²", "x + y = 6"],
          ["9", "min", "x² + y²", "x − y = 2"],
          ["10", "min", "x² + y²", "2x − y = 5"],
          ["11", "min", "x² + y²", "x + 2y = 5"],
          ["12", "min", "x² + y²", "2x + y = 10"]
        ];
        const kindClass = { "оба": "k-both", "min": "k-min" };
        function cells(r) {
          const cls = kindClass[r[1]] || "";
          return "<td class='num'>" + r[0] + "</td><td class='kind'><span class='pill-k " + cls + "'>" + r[1] + "</span></td><td class='fml'>" + r[2] + "</td><td class='fml'>" + r[3] + "</td>";
        }
        let h = "<thead><tr><th>№</th><th>тип</th><th>f</th><th>ограничение</th><th>№</th><th>тип</th><th>f</th><th>ограничение</th></tr></thead><tbody>";
        for (let i = 0; i < 6; i++) {
          h += "<tr>" + cells(rows[i]) + cells(rows[i + 6]) + "</tr>";
        }
        h += "</tbody>";
        document.getElementById("var-table").innerHTML = h;
      }
    }
  ];

  let i = 0;
  const main = document.getElementById("main");
  const toc = document.getElementById("toc");
  const phase = document.getElementById("phase");
  const counter = document.getElementById("counter");
  const bar = document.getElementById("bar");
  const prev = document.getElementById("prev");
  const next = document.getElementById("next");

  toc.innerHTML = "<h2>Ход практики</h2>" + slides.map(function (s, k) {
    return "<button type='button' data-i='" + k + "'><span class='n'>" + (k + 1) + "</span>" + s.toc + "</button>";
  }).join("");

  function render() {
    const s = slides[i];
    phase.textContent = s.phase;
    counter.textContent = (i + 1) + " / " + slides.length;
    bar.style.width = ((i + 1) / slides.length * 100) + "%";
    prev.disabled = i === 0;
    next.disabled = i === slides.length - 1;
    toc.querySelectorAll("button").forEach(function (b, k) { b.classList.toggle("active", k === i); });
    main.innerHTML = "<div class='slide" + (s.id === "hw" ? " hw-slide" : "") + "'><h1>" + s.title + "</h1><p class='lead'>" + s.lead + "</p>" + s.html + "</div>";
    if (s.onEnter) s.onEnter();
    const active = toc.querySelector("button.active");
    if (active) active.scrollIntoView({ block: "nearest" });
  }

  prev.onclick = function () { if (i > 0) { i--; render(); } };
  next.onclick = function () { if (i < slides.length - 1) { i++; render(); } };
  toc.onclick = function (e) {
    const b = e.target.closest("button[data-i]");
    if (!b) return;
    i = +b.getAttribute("data-i");
    render();
  };
  document.addEventListener("keydown", function (e) {
    if (e.target.closest("input, textarea")) return;
    const rbNext = document.getElementById("rb-next");
    const rbPrev = document.getElementById("rb-prev");
    if ((e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") && rbNext) {
      e.preventDefault();
      if (!rbNext.disabled) { rbNext.click(); return; }
      if (i < slides.length - 1) { i++; render(); }
      return;
    }
    if ((e.key === "ArrowLeft" || e.key === "PageUp") && rbPrev) {
      e.preventDefault();
      if (!rbPrev.disabled) { rbPrev.click(); return; }
      if (i > 0) { i--; render(); }
      return;
    }
    if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") {
      e.preventDefault();
      if (i < slides.length - 1) { i++; render(); }
    }
    if (e.key === "ArrowLeft" || e.key === "PageUp") {
      e.preventDefault();
      if (i > 0) { i--; render(); }
    }
  });

  const start = new URLSearchParams(location.search).get("s");
  if (start) {
    const n = parseInt(start, 10);
    if (!isNaN(n)) i = Math.max(0, Math.min(slides.length - 1, n - 1));
  }
  render();
})();
</script>
</body>
